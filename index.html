        // ==========================================
        // TRADUCTOR FIRESTORE -> ESTILO SUPABASE
        // Permite que el resto del código (30+ llamadas repartidas
        // por todo el archivo) siga funcionando SIN cambios, usando
        // la misma sintaxis .from().select().eq().single() etc.
        // Cada colección usa el campo "id" también como ID del
        // documento en Firestore, así .eq('id', x) resuelve directo
        // a un documento sin tener que escanear toda la colección.
        // ==========================================
        class FirestoreQueryBuilder {
            constructor(db, table) {
                this.db = db;
                this.table = table;
                this.colRef = db.collection(table);
                this._orderField = null;
                this._orderAsc = true;
                this._filters = []; // { field, op: 'eq'|'neq', value }
                this._op = null; // { type: 'insert'|'update'|'upsert'|'delete', payload }
                this._wantsSingle = false;
            }
            select() { return this; }
            order(field, opts) { this._orderField = field; this._orderAsc = opts?.ascending !== false; return this; }
            eq(field, value) { this._filters.push({ field, op: 'eq', value }); return this; }
            neq(field, value) { this._filters.push({ field, op: 'neq', value }); return this; }
            single() { this._wantsSingle = true; return this; }
            insert(rows) { this._op = { type: 'insert', rows }; return this; }
            update(patch) { this._op = { type: 'update', patch }; return this; }
            upsert(rows) { this._op = { type: 'upsert', rows }; return this; }
            delete() { this._op = { type: 'delete' }; return this; }

            // Hace que "await builder" funcione igual que en supabase-js
            then(resolve, reject) {
                this._exec().then(resolve, reject);
            }

            async _exec() {
                try {
                    if (this._op) return await this._execWrite();
                    return await this._execRead();
                } catch (e) {
                    console.error(`Firestore error [${this.table}]`, e);
                    return { data: null, error: e };
                }
            }

            _matchesRemainingFilters(row, skipIdEq) {
                return this._filters.every(f => {
                    if (skipIdEq && f.field === 'id' && f.op === 'eq') return true;
                    const rowVal = row ? row[f.field] : undefined;
                    if (f.op === 'eq') return rowVal === f.value;
                    if (f.op === 'neq') return rowVal !== f.value;
                    return true;
                });
            }

            _idEqValue() {
                const f = this._filters.find(f => f.field === 'id' && f.op === 'eq');
                return f ? f.value : undefined;
            }
            _idNeqValue() {
                const f = this._filters.find(f => f.field === 'id' && f.op === 'neq');
                return f ? f.value : undefined;
            }

            async _execRead() {
                const idEq = this._idEqValue();
                let rows;
                if (idEq !== undefined) {
                    const snap = await this.colRef.doc(idEq).get();
                    rows = snap.exists ? [snap.data()] : [];
                    rows = rows.filter(r => this._matchesRemainingFilters(r, true));
                } else {
                    let q = this.colRef;
                    if (this._orderField) q = q.orderBy(this._orderField, this._orderAsc ? 'asc' : 'desc');
                    const snap = await q.get();
                    rows = snap.docs.map(d => d.data()).filter(r => this._matchesRemainingFilters(r, false));
                }
                if (this._wantsSingle) return { data: rows[0] || null, error: null };
                return { data: rows, error: null };
            }

            async _execWrite() {
                const { type } = this._op;
                const idEq = this._idEqValue();
                if (type === 'delete') {
                    if (idEq !== undefined) {
                        await this.colRef.doc(idEq).delete();
                        return { data: null, error: null };
                    }
                    const idNeq = this._idNeqValue();
                    if (idNeq !== undefined) {
                        const snap = await this.colRef.get();
                        const batch = this.db.batch();
                        snap.docs.forEach(d => { if (d.id !== idNeq && this._matchesRemainingFilters(d.data(), false)) batch.delete(d.ref); });
                        await batch.commit();
                        return { data: null, error: null };
                    }
                    // Delete masivo con filtros por otros campos (sin id)
                    const snap = await this.colRef.get();
                    const batch = this.db.batch();
                    snap.docs.forEach(d => { if (this._matchesRemainingFilters(d.data(), false)) batch.delete(d.ref); });
                    await batch.commit();
                    return { data: null, error: null };
                }
                if (type === 'update') {
                    if (idEq === undefined) return { data: null, error: new Error('update sin .eq(id, ...)') };
                    await this.colRef.doc(idEq).set(this._op.patch, { merge: true });
                    if (this._wantsSingle) {
                        const snap = await this.colRef.doc(idEq).get();
                        return { data: snap.data(), error: null };
                    }
                    return { data: null, error: null };
                }
                if (type === 'insert' || type === 'upsert') {
                    const rows = this._op.rows.map(r => ({ ...r, id: r.id || crypto.randomUUID() }));
                    const batch = this.db.batch();
                    rows.forEach(r => batch.set(this.colRef.doc(r.id), r, { merge: type === 'upsert' }));
                    await batch.commit();
                    if (this._wantsSingle) return { data: rows[0], error: null };
                    return { data: rows, error: null };
                }
            }
        }

        function firestoreClientAdapter(db) {
            return { from: (table) => new FirestoreQueryBuilder(db, table) };
        }

                showToast("Error de Conexión", "No se pudo conectar a Firebase. Iniciando en Modo Demo.", "error");

        // Live Database Realtime listeners (Firestore onSnapshot)
        function setupSupabaseRealtime(db) {
            if (!db) return;
            const watchedTables = ['merchandise', 'inventory_history', 'access_codes', 'sectors', 'employees', 'employee_advances', 'employee_payments', 'employee_settlements'];
            // Firestore dispara el callback DOS veces al conectar (una con datos de
            // caché local y otra con datos del servidor), aunque no haya cambios
            // reales. Ignoramos esas 2 primeras vueltas por colección para no
            // redibujar la pantalla de golpe (eso interrumpía a alguien escribiendo
            // en el login, por ejemplo).
            let skipCount = {};
            watchedTables.forEach(table => {
                skipCount[table] = 2;
                db.collection(table).onSnapshot(() => {
                    if (skipCount[table] > 0) { skipCount[table]--; return; }
                    scheduleSupabaseSync();
                }, (err) => console.error(`Error de snapshot en ${table}:`, err));
            });
            skipCount['app_settings'] = 2;
            db.collection('app_settings').onSnapshot(() => {
                if (skipCount['app_settings'] > 0) { skipCount['app_settings']--; return; }
                loadSettings();
                scheduleSupabaseSync();
            }, (err) => console.error('Error de snapshot en app_settings:', err));
            showToast("Sincronización Activa 📡", "Conectado a la base de datos de Agua Verde.", "success");
        }

        function scheduleSupabaseSync(delay = 250) {
            clearTimeout(realtimeSyncTimer);
            realtimeSyncTimer = setTimeout(() => fetchAndSyncFromSupabase(), delay);
        }

        async function fetchAndSyncFromSupabase() {
            if (!isLiveSupabase || !supabaseClient) return false;
            const requestId = ++latestSyncRequest;

            try {
                const [sectorsResult, codesResult, merchResult, historyResult, employeesResult, advancesResult, paymentsResult, settlementsResult] = await Promise.all([
                    supabaseClient.from('sectors').select('*').order('name', { ascending: true }),
                    supabaseClient.from('access_codes').select('*'),
                    supabaseClient.from('merchandise').select('*'),
                    supabaseClient.from('inventory_history').select('*').order('created_at', { ascending: false }),
                    supabaseClient.from('employees').select('*').order('name', { ascending: true }),
                    supabaseClient.from('employee_advances').select('*').order('date', { ascending: false }),
                    supabaseClient.from('employee_payments').select('*').order('date', { ascending: false }),
                    supabaseClient.from('employee_settlements').select('*').order('created_at', { ascending: false })
                ]);

                // Prevent an older, slower request from overwriting fresher data.
                if (requestId !== latestSyncRequest) return false;

                const current = getMockDb();
                const results = [sectorsResult, codesResult, merchResult, historyResult, employeesResult, advancesResult, paymentsResult, settlementsResult];
                const errors = results.map(r => r.error).filter(Boolean);
                errors.forEach(error => console.error('Error parcial de sincronización Supabase:', error));

                const dbObj = {
                    sectors: sectorsResult.error ? current.sectors : (sectorsResult.data || []),
                    access_codes: codesResult.error ? current.access_codes : (codesResult.data || []),
                    merchandise: merchResult.error ? current.merchandise : (merchResult.data || []),
                    inventory_history: historyResult.error ? current.inventory_history : (historyResult.data || []),
                    employees: employeesResult.error ? current.employees : (employeesResult.data || []),
                    employee_advances: advancesResult.error ? current.employee_advances : (advancesResult.data || []),
                    employee_payments: paymentsResult.error ? current.employee_payments : (paymentsResult.data || []),
                    employee_settlements: settlementsResult.error ? current.employee_settlements : (settlementsResult.data || [])
                };

                localStorage.setItem('agua_verde_db_pro', JSON.stringify(dbObj));
                renderAllScreens();
                return errors.length === 0;
            } catch (err) {
                console.error('Error en sincronización Supabase:', err);
                return false;
            }
        }

        function createUuid() {
            if (crypto?.randomUUID) return crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        }

        async function db_insertAuditLog(logData, retries = 3) {
            if (!isLiveSupabase || !supabaseClient) return null;
            const payload = { id: logData.id || createUuid(), ...logData };
            let lastError = null;

            for (let attempt = 1; attempt <= retries; attempt++) {
                const { data, error } = await supabaseClient
                    .from('inventory_history')
                    .insert([payload])
                    .select()
                    .single();
                if (!error) return data;
                // A duplicated UUID means a previous timed-out request actually succeeded.
                if (error.code === '23505') return payload;
                lastError = error;
                if (attempt < retries) await new Promise(resolve => setTimeout(resolve, 350 * attempt));
            }

            console.error('No se pudo guardar la auditoría:', lastError);
            showToast('Auditoría no guardada', 'La operación fue detenida para no dejar el inventario sin registro.', 'error');
            return null;
        }

        function assignedPersonName(value) {
            return String(value || '')
                .replace(/\s*\((dueño|dueno|owner|admin|administrador|personal|staff)\)\s*$/i, '')
                .trim();
        }

        function normalizePersonName(value) {
            return assignedPersonName(value)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, ' ')
                .trim()
                .replace(/\s+/g, ' ');
        }

        async function db_validateCode(code, inputFirstName, inputLastName) {
            const cleanCode = code.trim().toUpperCase();
            const enteredName = `${inputFirstName.trim()} ${inputLastName.trim()}`;

            if (isLiveSupabase && supabaseClient) {
                const { data, error } = await supabaseClient
                    .from('access_codes')
                    .select('*')
                    .eq('code', cleanCode)
                    .eq('active', true)
                    .single();

                if (error || !data) return null;
                const registeredName = assignedPersonName(data.name);
                if (normalizePersonName(enteredName) !== normalizePersonName(registeredName)) {
                    return { error: 'name_mismatch' };
                }
                const parts = registeredName.split(/\s+/);
                return {
                    code: data.code,
                    name: registeredName,
                    first_name: parts[0] || '',
                    last_name: parts.slice(1).join(' '),
                    role: data.role,
                    sector_id: data.sector_id,
                    can_view_all: data.can_view_all,
                    can_manage_employees: data.can_manage_employees === true
                };
            }

            const db = getMockDb();
            const found = db.access_codes.find(c => c.code.toUpperCase() === cleanCode && c.active);
            if (!found) return null;
            const registeredName = assignedPersonName(found.name);
            if (normalizePersonName(enteredName) !== normalizePersonName(registeredName)) {
                return { error: 'name_mismatch' };
            }
            const parts = registeredName.split(/\s+/);
            return {
                code: found.code,
                name: registeredName,
                first_name: parts[0] || '',
                last_name: parts.slice(1).join(' '),
                role: found.role,
                sector_id: found.sector_id,
                can_view_all: found.can_view_all,
                can_manage_employees: found.can_manage_employees === true
            };
        }

        async function db_getSectors() {
            const db = getMockDb();
            return db.sectors.sort((a,b) => a.name.localeCompare(b.name));
        }

        async function db_updateQuantity(merchId, delta, userSession, exitReason = "Ninguno", comment = "") {
            const db = getMockDb();
            const original = db.merchandise.find(m => m.id === merchId);
            if (!original) return false;

            const oldQty = parseFloat(original.quantity);
            const newQty = oldQty + delta;
            const previousUpdatedBy = original.updated_by;
            const previousUpdatedAt = original.updated_at;

            // 1. BLOCK NEGATIVE STOCKS
            if (newQty < 0) {
                showModalAlert("❌ Saldo Insuficiente", `Acción Bloqueada: No puedes retirar más mercadería de la existente en el inventario.<br><br><strong>Artículo:</strong> ${original.name}<br><strong>Stock Actual:</strong> ${oldQty} ${original.unit}<br><strong>Intento de retiro:</strong> ${Math.abs(delta)} ${original.unit}`);
                return false;
            }

            // 2. LARGE ADJUSTMENT REQUIRED COMMENT CHECK
            const absDelta = Math.abs(delta);
            if (absDelta >= systemSettings.large_adjustment_threshold && !comment.trim()) {
                openLargeAdjustmentPrompt(merchId, delta, userSession, exitReason, oldQty, original.name, original.unit);
                return false;
            }

            const sector = db.sectors.find(s => s.id === original.sector_id);
            const sectorName = sector ? sector.name : 'Desconocido';

            let details = `Cantidad modificada de ${oldQty} a ${newQty} ${original.unit} por ${userSession.name}.`;
            if (exitReason !== "Ninguno") {
                details += ` [Motivo de egreso: ${exitReason}]`;
            }
            if (comment.trim()) {
                details += ` [Nota: "${comment.trim()}"]`;
            }

            if (isLiveSupabase && supabaseClient) {
                const { error } = await supabaseClient
                    .from('merchandise')
                    .update({ 
                        quantity: newQty, 
                        updated_by: `${userSession.name} (${userSession.code})`,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', merchId);

                if (error) {
                    showToast("Error", "Error al actualizar stock.", "error");
                    return false;
                }

                const auditSaved = await db_insertAuditLog({
                    merchandise_id: merchId,
                    sector_id: original.sector_id,
                    sector_name: sectorName,
                    merchandise_name: original.name,
                    action: 'update',
                    quantity_before: oldQty,
                    quantity_after: newQty,
                    details,
                    user_code: userSession.code,
                    user_name: userSession.name
                });

                if (!auditSaved) {
                    await supabaseClient.from('merchandise').update({
                        quantity: oldQty,
                        updated_by: previousUpdatedBy,
                        updated_at: previousUpdatedAt
                    }).eq('id', merchId);
                    await fetchAndSyncFromSupabase();
                    return false;
                }
                await fetchAndSyncFromSupabase();
            } else {
                original.quantity = newQty;
                original.updated_by = `${userSession.name} (${userSession.code})`;
                original.updated_at = new Date().toISOString();

                const log = {
                    id: 'h-' + Math.random().toString(36).substr(2, 9),
                    merchandise_id: merchId,
                    sector_id: original.sector_id,
                    sector_name: sectorName,
                    merchandise_name: original.name,
                    action: 'update',
                    quantity_before: oldQty,
                    quantity_after: newQty,
                    details: details,
                    user_code: userSession.code,
                    user_name: userSession.name,
                    created_at: new Date().toISOString()
                };

                db.inventory_history.push(log);
                saveMockDb(db);
            }
            return true;
        }

        async function db_transferMerchandise(merchId, targetSectorId, qtyVal, userSession, comment = "") {
            const transferQty = parseFloat(qtyVal);
            if (isNaN(transferQty) || transferQty <= 0) {
                showToast("Cantidad inválida", "La cantidad a traspasar debe ser mayor a cero.", "warning");
                return false;
            }

            const db = getMockDb();
            const sourceItem = db.merchandise.find(m => m.id === merchId);
            if (!sourceItem) return false;

            const oldSourceQty = parseFloat(sourceItem.quantity);
            if (oldSourceQty < transferQty) {
                showModalAlert("❌ Traspaso Fallido", `No hay suficiente stock en tu sector para realizar el traspaso.<br><br><strong>Disponible:</strong> ${oldSourceQty} ${sourceItem.unit}<br><strong>Intentado:</strong> ${transferQty} ${sourceItem.unit}`);
                return false;
            }

            const sourceSec = db.sectors.find(s => s.id === sourceItem.sector_id);
            const sourceSecName = sourceSec ? sourceSec.name : 'Sector de Origen';
            const targetSec = db.sectors.find(s => s.id === targetSectorId);
            const targetSecName = targetSec ? targetSec.name : 'Sector de Destino';
            const newSourceQty = oldSourceQty - transferQty;
            const targetItem = db.merchandise.find(m => m.sector_id === targetSectorId && m.name.toLowerCase() === sourceItem.name.toLowerCase() && m.active);
            const targetBefore = targetItem ? parseFloat(targetItem.quantity) : 0;
            const targetAfter = targetBefore + transferQty;

            let logDetails = `Traspaso: Se enviaron ${transferQty} ${sourceItem.unit} desde "${sourceSecName}" hacia "${targetSecName}" por ${userSession.name}.`;
            if (comment.trim()) logDetails += ` [Nota: "${comment.trim()}"]`;

            if (isLiveSupabase && supabaseClient) {
                const sourcePrevious = { updated_by: sourceItem.updated_by, updated_at: sourceItem.updated_at };
                const { error: sourceError } = await supabaseClient.from('merchandise').update({
                    quantity: newSourceQty,
                    updated_by: `${userSession.name} (${userSession.code})`,
                    updated_at: new Date().toISOString()
                }).eq('id', merchId);
                if (sourceError) {
                    showToast('Error', 'No se pudo actualizar el sector de origen.', 'error');
                    return false;
                }

                let targetMerchId = targetItem?.id || null;
                let createdTarget = false;
                if (targetItem) {
                    const { error: targetError } = await supabaseClient.from('merchandise').update({
                        quantity: targetAfter,
                        updated_by: `${userSession.name} (${userSession.code})`,
                        updated_at: new Date().toISOString()
                    }).eq('id', targetItem.id);
                    if (targetError) {
                        await supabaseClient.from('merchandise').update({ quantity: oldSourceQty, ...sourcePrevious }).eq('id', merchId);
                        showToast('Error', 'No se pudo actualizar el sector de destino.', 'error');
                        return false;
                    }
                } else {
                    const { data: insertedTarget, error: targetError } = await supabaseClient.from('merchandise').insert([{
                        sector_id: targetSectorId,
                        name: sourceItem.name,
                        quantity: transferQty,
                        unit: sourceItem.unit,
                        active: true,
                        updated_by: `${userSession.name} (${userSession.code})`
                    }]).select().single();
                    if (targetError || !insertedTarget) {
                        await supabaseClient.from('merchandise').update({ quantity: oldSourceQty, ...sourcePrevious }).eq('id', merchId);
                        showToast('Error', 'No se pudo crear el artículo en el sector de destino.', 'error');
                        return false;
                    }
                    targetMerchId = insertedTarget.id;
                    createdTarget = true;
                }

                const rollbackTransfer = async () => {
                    await supabaseClient.from('merchandise').update({ quantity: oldSourceQty, ...sourcePrevious }).eq('id', merchId);
                    if (createdTarget) await supabaseClient.from('merchandise').delete().eq('id', targetMerchId);
                    else await supabaseClient.from('merchandise').update({
                        quantity: targetBefore,
                        updated_by: targetItem.updated_by,
                        updated_at: targetItem.updated_at
                    }).eq('id', targetMerchId);
                };

                const sourceAudit = await db_insertAuditLog({
                    merchandise_id: merchId,
                    sector_id: sourceItem.sector_id,
                    sector_name: sourceSecName,
                    merchandise_name: sourceItem.name,
                    action: 'transfer',
                    quantity_before: oldSourceQty,
                    quantity_after: newSourceQty,
                    details: logDetails,
                    user_code: userSession.code,
                    user_name: userSession.name
                });
                if (!sourceAudit) {
                    await rollbackTransfer();
                    await fetchAndSyncFromSupabase();
                    return false;
                }

                const targetAudit = await db_insertAuditLog({
                    merchandise_id: targetMerchId,
                    sector_id: targetSectorId,
                    sector_name: targetSecName,
                    merchandise_name: sourceItem.name,
                    action: 'transfer',
                    quantity_before: targetBefore,
                    quantity_after: targetAfter,
                    details: `Ingreso por traspaso: ${transferQty} ${sourceItem.unit} desde "${sourceSecName}" por ${userSession.name}.`,
                    user_code: userSession.code,
                    user_name: userSession.name
                });
                if (!targetAudit) {
                    await supabaseClient.from('inventory_history').delete().eq('id', sourceAudit.id);
                    await rollbackTransfer();
                    await fetchAndSyncFromSupabase();
                    return false;
                }

                await fetchAndSyncFromSupabase();
            } else {
                sourceItem.quantity = newSourceQty;
                sourceItem.updated_by = `${userSession.name} (${userSession.code})`;
                sourceItem.updated_at = new Date().toISOString();

                let targetMerchId;
                if (targetItem) {
                    targetItem.quantity = targetAfter;
                    targetItem.updated_by = `${userSession.name} (${userSession.code})`;
                    targetItem.updated_at = new Date().toISOString();
                    targetMerchId = targetItem.id;
                } else {
                    const freshItem = {
                        id: 'm-' + Math.random().toString(36).substr(2, 9),
                        sector_id: targetSectorId,
                        name: sourceItem.name,
                        quantity: transferQty,
                        unit: sourceItem.unit,
                        active: true,
                        updated_by: `${userSession.name} (${userSession.code})`,
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    };
                    db.merchandise.push(freshItem);
                    targetMerchId = freshItem.id;
                }

                db.inventory_history.push({
                    id: 'h-' + Math.random().toString(36).substr(2, 9),
                    merchandise_id: merchId,
                    sector_id: sourceItem.sector_id,
                    sector_name: sourceSecName,
                    merchandise_name: sourceItem.name,
                    action: 'transfer',
                    quantity_before: oldSourceQty,
                    quantity_after: newSourceQty,
                    details: logDetails,
                    user_code: userSession.code,
                    user_name: userSession.name,
                    created_at: new Date().toISOString()
                }, {
                    id: 'h-' + Math.random().toString(36).substr(2, 9),
                    merchandise_id: targetMerchId,
                    sector_id: targetSectorId,
                    sector_name: targetSecName,
                    merchandise_name: sourceItem.name,
                    action: 'transfer',
                    quantity_before: targetBefore,
                    quantity_after: targetAfter,
                    details: `Ingreso por traspaso: ${transferQty} ${sourceItem.unit} desde "${sourceSecName}" por ${userSession.name}.`,
                    user_code: userSession.code,
                    user_name: userSession.name,
                    created_at: new Date().toISOString()
                });
                saveMockDb(db);
            }
            return true;
        }

        async function db_updateAccessCode(codeId, updates, userSession) {
            const db = getMockDb();
            const target = db.access_codes.find(c => c.id === codeId);
            if (!target || !userSession) return false;

            const isOwner = userSession.role === 'owner';
            const adminAllowed = userSession.role === 'admin' &&
                target.sector_id === userSession.sector_id && target.role !== 'owner';
            if (!isOwner && !adminAllowed) {
                showToast('Acceso denegado', 'Solo podés editar códigos autorizados de tu sector.', 'error');
                return false;
            }

            const patch = {};
            if (updates.name !== undefined) {
                const cleanName = updates.name.trim();
                if (!cleanName) {
                    showToast('Nombre inválido', 'El nombre no puede quedar vacío.', 'warning');
                    return false;
                }
                patch.name = cleanName;
            }
            if (updates.code !== undefined) {
                const cleanCode = updates.code.trim().toUpperCase();
                if (cleanCode.length < 4 || cleanCode.length > 6) {
                    showModalAlert("⚠️ Código Inválido", "Error: El código de acceso debe tener obligatoriamente entre 4 y 6 caracteres.");
                    return false;
                }
                const dup = db.access_codes.find(c => c.id !== codeId && c.code.toUpperCase() === cleanCode);
                if (dup) {
                    showToast("Duplicado", "Ese código ya está asignado a otra persona.", "warning");
                    return false;
                }
                patch.code = cleanCode;
            }
            if (updates.can_manage_employees !== undefined) {
                patch.can_manage_employees = !!updates.can_manage_employees;
            }

            if (Object.keys(patch).length === 0) return true;

            if (isLiveSupabase && supabaseClient) {
                const { error } = await supabaseClient.from('access_codes').update(patch).eq('id', codeId);
                if (error) {
                    console.error('Error al editar código:', error);
                    showToast('Error', 'No se pudo guardar el cambio.', 'error');
                    return false;
                }
                await fetchAndSyncFromSupabase();
            } else {
                Object.assign(target, patch);
                saveMockDb(db);
            }

            // Si la persona editó su propia sesión activa, refrescamos ese estado en memoria
            Object.keys(activeSessions).forEach(screenKey => {
                const s = activeSessions[screenKey];
                if (s && s.code && target.code && s.code.toUpperCase() === (patch.code || target.code).toUpperCase() && s.name) {
                    if (patch.name) s.name = patch.name;
                    if (patch.code) s.code = patch.code;
                }
            });

            showToast('Guardado ✅', 'Los datos del código se actualizaron correctamente.', 'success');
            return true;
        }

        // --- LIQUIDACIONES ---
        // Cálculo AUTOMÁTICO aproximado según legislación laboral de Uruguay.
        // OJO: es una referencia práctica, no asesoramiento legal/contable.
        // BPS, topes y franjas cambian; validar con un contador antes de pagar.
        function calcularLiquidacionUY(params) {
            const {
                monthlySalaryRef,   // mejor sueldo mensual nominal de referencia
                startDate,          // fecha de ingreso
                endDate,            // fecha de egreso
                settlementType,     // 'renuncia' | 'despido_comun' | 'fin_zafra' | 'fin_contrato'
                mesesAguinaldoYaPagados // meses ya cubiertos por aguinaldo pagado (0-12)
            } = params;

            const start = new Date(startDate);
            const end = new Date(endDate);
            const msPerDay = 1000 * 60 * 60 * 24;
            const diasTrabajadosTotal = Math.max(0, Math.round((end - start) / msPerDay));
            const mesesTrabajadosTotal = diasTrabajadosTotal / 30;
            const aniosCompletos = Math.floor(diasTrabajadosTotal / 365);

            const sueldoDiario = monthlySalaryRef / 30;

            // Aguinaldo proporcional: meses NO cubiertos aún, desde el último pago
            const mesesPendientesAguinaldo = Math.max(0, Math.min(12, mesesTrabajadosTotal) - (mesesAguinaldoYaPagados || 0));
            const aguinaldo = (monthlySalaryRef * mesesPendientesAguinaldo) / 12;

            // Licencia no gozada: 20 días hábiles/año, proporcional a meses trabajados en el año en curso
            const mesesParaLicencia = mesesTrabajadosTotal % 12 === 0 && mesesTrabajadosTotal > 0 ? 12 : (mesesTrabajadosTotal % 12);
            const diasLicencia = Math.round((20 / 12) * mesesParaLicencia * 10) / 10;
            const licenciaNoGozada = diasLicencia * sueldoDiario;

            // Salario vacacional: aproximación simple = equivalente a los días de licencia
            const salarioVacacional = diasLicencia * sueldoDiario;

            // Indemnización por despido común: 1 mes por año trabajado o fracción, tope 6 meses.
            // No corresponde en renuncia ni en fin de zafra/contrato pactado de antemano.
            let indemnizacion = 0;
            if (settlementType === 'despido_comun') {
                const aniosParaIndemnizacion = Math.min(6, Math.ceil(diasTrabajadosTotal / 365));
                indemnizacion = monthlySalaryRef * aniosParaIndemnizacion;
            }

            const subtotal = aguinaldo + licenciaNoGozada + salarioVacacional + indemnizacion;

            return {
                dias_trabajados_total: diasTrabajadosTotal,
                anios_completos: aniosCompletos,
                aguinaldo: Math.round(aguinaldo),
                dias_licencia: diasLicencia,
                licencia_no_gozada: Math.round(licenciaNoGozada),
                salario_vacacional: Math.round(salarioVacacional),
                indemnizacion: Math.round(indemnizacion),
                subtotal: Math.round(subtotal)
            };
        }

        async function db_createSettlement(settlement, userSession) {
            if (!canManageEmployees(userSession)) {
                showToast('Acceso denegado', 'No tenés permiso para gestionar Empleados.', 'error');
                return false;
            }
            if (!settlement.employee_id) {
                showToast('Falta el empleado', 'Elegí a qué empleado corresponde la liquidación.', 'warning');
                return false;
            }

            const db = getMockDb();
            const adelantosPendientes = db.employee_advances
                .filter(a => a.employee_id === settlement.employee_id && !a.settled)
                .reduce((sum, a) => sum + Number(a.amount), 0);

            const row = {
                id: crypto.randomUUID(),
                employee_id: settlement.employee_id,
                settlement_type: settlement.settlement_type,
                calc_mode: settlement.calc_mode, // 'auto' | 'manual'
                start_date: settlement.start_date,
                end_date: settlement.end_date,
                monthly_salary_ref: Number(settlement.monthly_salary_ref) || 0,
                detail: settlement.detail || {},
                adelantos_descontados: adelantosPendientes,
                total: Math.max(0, Number(settlement.total) - adelantosPendientes),
                total_bruto: Number(settlement.total),
                notes: (settlement.notes || '').trim(),
                created_at: new Date().toISOString()
            };

            if (isLiveSupabase && supabaseClient) {
                const { error } = await supabaseClient.from('employee_settlements').insert([row]);
                if (error) { console.error(error); showToast('Error', 'No se pudo guardar la liquidación.', 'error'); return false; }
                // Marcamos los adelantos como saldados
                const pendientes = db.employee_advances.filter(a => a.employee_id === settlement.employee_id && !a.settled);
                for (const a of pendientes) {
                    await supabaseClient.from('employee_advances').update({ settled: true }).eq('id', a.id);
                }
                await fetchAndSyncFromSupabase();
            } else {
                db.employee_settlements.push(row);
                db.employee_advances.forEach(a => {
                    if (a.employee_id === settlement.employee_id && !a.settled) a.settled = true;
                });
                saveMockDb(db);
            }
            showToast('Liquidación generada 📋', `Total a pagar: ${formatUYU(row.total)}`, 'success');
            return true;
        }

                    <div class="bg-slate-100 border border-slate-200 p-2.5 rounded-xl shadow-sm">
                        <span class="text-[9px] uppercase font-bold text-slate-600 block">Por Día</span>
                        <span class="text-base font-extrabold text-slate-800">${countByType('diario')}</span>

                </div>

                <button onclick="openAddEmployeeModal()" class="w-full bg-[#0d3a22] hover:bg-emerald-800 text-white font-bold text-xs py-3 rounded-xl shadow-md transition">
                    ➕ Nueva Alta de Empleado
                </button>

                <div class="space-y-2">
            `;

            if (activeEmployees.length === 0) {
                html += `<p class="text-center text-slate-400 text-xs py-6">Todavía no cargaste empleados activos.</p>`;
            }

            activeEmployees.forEach(emp => {
                html += renderEmployeeCard(emp, db);
            });

            html += `</div>`;

            if (inactiveEmployees.length > 0) {
                html += `
                    <button onclick="showInactiveEmployees = !showInactiveEmployees; renderAllScreens();" class="text-[10px] font-bold text-slate-400 hover:text-slate-600 pt-2">

                    html += `<div class="space-y-2 opacity-70">`;
                    inactiveEmployees.forEach(emp => { html += renderEmployeeCard(emp, db); });
                    html += `</div>`;
                }
            }

            return html;
        }

        function renderEmployeeCard(emp, db) {
            const adelantosPendientes = db.employee_advances

                .reduce((s, a) => s + Number(a.amount), 0);

            return `
                <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm flex justify-between items-center gap-2">
                    <div class="min-w-0">
                        <p class="font-extrabold text-sm text-slate-800 truncate">${escapeHtml(emp.name)}</p>
                        <p class="text-[10px] text-slate-500 truncate">${escapeHtml(emp.position || 'Sin cargo asignado')} · ${employmentTypeLabel(emp.employment_type)}</p>

                        ${!emp.active ? `<p class="text-[9px] text-red-500 font-bold mt-0.5">BAJA: ${emp.end_date || '-'}</p>` : ''}
                    </div>
                    <div class="flex gap-1.5 shrink-0">
                        <button onclick="openEmployeeManageModal('${emp.id}')" class="bg-slate-800 hover:bg-slate-950 text-white px-2.5 py-1.5 rounded-lg text-[10px] font-bold">📋 Gestionar</button>

                    </div>
                </div>
            `;

        function updateEmpRateLabel() {
            const type = document.getElementById('emp-type').value;
            const label = document.getElementById('emp-rate-label');
            if (!label) return;
            if (type === 'diario') label.textContent = 'Jornal Diario ($)';
            else if (type === 'zafral') label.textContent = 'Monto Acordado por Zafra / Jornal ($)';
            else label.textContent = 'Sueldo Mensual ($)';
        }

        // Devuelve la sesión activa que esté gestionando Empleados (dueño o admin autorizado)
        function getCurrentOwnerOrAdminSession() {
            if (activeSessions.owner) return activeSessions.owner;
            if (activeSessions.admin && canManageEmployees(activeSessions.admin)) return activeSessions.admin;
            if (activeSessions.fullscreen && canManageEmployees(activeSessions.fullscreen)) return activeSessions.fullscreen;
            return null;
        }

        function openEmployeeManageModal(employeeId) {
            currentManagedEmployeeId = employeeId;
            employeeModalTab = 'datos';
            renderEmployeeManageModal();
        }

        function switchEmployeeModalTab(tabName) {
            employeeModalTab = tabName;
            lastSettlementPreview = null;
            renderEmployeeManageModal();
        }

        function renderEmployeeManageModal() {
            const db = getMockDb();
            const emp = db.employees.find(e => e.id === currentManagedEmployeeId);
            let existing = document.getElementById('dynamic-modal');
            if (!existing) {
                existing = document.createElement('div');
                existing.id = 'dynamic-modal';
                existing.className = "fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-pop-up";
                document.body.appendChild(existing);
            }
            if (!emp) { existing.remove(); return; }

            const tabs = [
                { id: 'datos', label: '👤 Datos' },
                { id: 'adelantos', label: '💵 Adelantos' },
                { id: 'pagos', label: '💰 Pagos' },
                { id: 'liquidacion', label: '📋 Liquidación' }
            ];

            existing.innerHTML = `
                <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200 max-h-[92vh] flex flex-col">
                    <div class="bg-slate-900 text-white p-4 font-bold flex justify-between items-center shrink-0">
                        <div>
                            <h4 class="text-sm font-serif">${escapeHtml(emp.name)}</h4>
                            <p class="text-[9px] text-slate-300 font-normal">${escapeHtml(emp.position || 'Sin cargo')} · ${employmentTypeLabel(emp.employment_type)}</p>

                    <div class="bg-slate-50 border-b border-slate-200 px-3 flex gap-3 text-[10px] font-bold overflow-x-auto whitespace-nowrap shrink-0">
                        ${tabs.map(t => `
                            <button onclick="switchEmployeeModalTab('${t.id}')" class="py-2.5 ${employeeModalTab === t.id ? 'border-b-2 border-[#198754] text-[#0d3a22]' : 'text-slate-500'}">${t.label}</button>
                        `).join('')}
                    </div>
                    <div id="employee-modal-body" class="p-4 overflow-y-auto text-xs space-y-3">
                        ${renderEmployeeModalTabBody(emp, db)}
                    </div>
                </div>
            `;
        }

            if (employeeModalTab === 'datos') return renderEmpTabDatos(emp);
            if (employeeModalTab === 'adelantos') return renderEmpTabAdelantos(emp, db);
            if (employeeModalTab === 'pagos') return renderEmpTabPagos(emp, db);
            if (employeeModalTab === 'liquidacion') return renderEmpTabLiquidacion(emp, db);
            return '';
        }

                }
            `;

            const ok = await db_updateEmployee(employeeId, {
                name: document.getElementById('edit-emp-name').value.trim(),
                document_id: document.getElementById('edit-emp-doc').value.trim(),
                position: document.getElementById('edit-emp-position').value.trim(),
                employment_type: document.getElementById('edit-emp-type').value,
                pay_rate: Number(document.getElementById('edit-emp-rate').value) || 0,
                start_date: document.getElementById('edit-emp-start').value,

            const ok = await db_deactivateEmployee(employeeId, new Date().toISOString().slice(0,10), getCurrentOwnerOrAdminSession());

        }

        function submitCalcSettlement(employeeId) {
            const salaryRef = Number(document.getElementById('liq-salary').value) || 0;
            if (salaryRef <= 0) {
                showToast('Falta el sueldo de referencia', 'Ingresá el mejor sueldo mensual para poder calcular.', 'warning');
                return;
            }
            lastSettlementPreview = calcularLiquidacionUY({
                monthlySalaryRef: salaryRef,
                startDate: document.getElementById('liq-start').value,
                endDate: document.getElementById('liq-end').value,
                settlementType: document.getElementById('liq-type').value,
                mesesAguinaldoYaPagados: Number(document.getElementById('liq-aguinaldo-pagado').value) || 0
            });
            lastSettlementPreview._meta = {
                settlement_type: document.getElementById('liq-type').value,
                start_date: document.getElementById('liq-start').value,
                end_date: document.getElementById('liq-end').value,
                monthly_salary_ref: salaryRef
            };
            renderEmployeeManageModal();
        }

        async function submitSaveSettlement(employeeId, totalBruto) {
            const meta = lastSettlementPreview._meta;
            const ok = await db_createSettlement({
                employee_id: employeeId,
                settlement_type: meta.settlement_type,
                calc_mode: 'auto',
                start_date: meta.start_date,
                end_date: meta.end_date,
                monthly_salary_ref: meta.monthly_salary_ref,
                detail: lastSettlementPreview,
                total: totalBruto
            }, getCurrentOwnerOrAdminSession());
            if (ok) {
                lastSettlementPreview = null;
                renderEmployeeManageModal();
                renderAllScreens();
            }
        }

        async function submitDeleteSettlement(settlementId, employeeId) {
            await db_deleteSettlement(settlementId, getCurrentOwnerOrAdminSession());
            renderEmployeeManageModal(); renderAllScreens();
        }

        function toggleConfigModal(show) {
            const modal = document.getElementById('modal-config');
            if (show) {
                document.getElementById('input-sb-url').value = localStorage.getItem('SUPABASE_URL') || '';
                document.getElementById('input-sb-key').value = localStorage.getItem('SUPABASE_KEY') || '';
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function saveSupabaseConfig() {
            const url = document.getElementById('input-sb-url').value.trim();
            const key = document.getElementById('input-sb-key').value.trim();

            if (!url || !key) {
                showToast("Ingresa Campos", "Es requerido URL y Anon Key.", "warning");
                return;
            }

            localStorage.setItem('SUPABASE_URL', url);
            localStorage.setItem('SUPABASE_KEY', key);
            
            toggleConfigModal(false);
            initSupabaseClient();
        }

        function clearSupabaseConfig() {
            localStorage.removeItem('SUPABASE_URL');
            localStorage.removeItem('SUPABASE_KEY');
            isLiveSupabase = false;
            supabaseClient = null;
            
            toggleConfigModal(false);
            initSupabaseClient();
            renderAllScreens();
            showToast("Volviendo a Demo", "La simulación de Agua Verde está lista para usar de forma local.", "info");
        }

        // --- MANAGE ACTIONS ---
        async function adjustStock(merchId, delta, screenContext, exitReason = "Ninguno", comment = "") {
            let user = null;
            if (screenContext === 'owner') user = activeSessions.owner;
            else if (screenContext === 'admin') user = activeSessions.admin;
            else if (screenContext === 'staff') user = activeSessions.staff;
            else if (screenContext === 'fullscreen') user = activeSessions.fullscreen;

            if (!user) return;

            const updated = await db_updateQuantity(merchId, delta, user, exitReason, comment);
            if (updated) {
                showToast("Stock Modificado", "Inventario actualizado correctamente.", "success");
                if (!isLiveSupabase) renderAllScreens();
            }
        }

        function promptReasonAndAdjust(merchId, delta, screenContext) {
            const db = getMockDb();
            const original = db.merchandise.find(m => m.id === merchId);
            if (!original) return;

            const oldQty = parseFloat(original.quantity);
            if (oldQty + delta < 0) {
                db_updateQuantity(merchId, delta, activeSessions[screenContext] || activeSessions.fullscreen);

            }

            const modal = document.createElement('div');

        function openLargeAdjustmentPrompt(merchId, delta, userSession, exitReason, oldQty, itemName, unit) {
            const modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-black/80 z-55 flex items-center justify-center p-4 backdrop-blur-sm animate-pop-up";
            modal.id = "large-adjust-modal";
            modal.innerHTML = `
                <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full overflow-hidden border border-amber-300">
                    <div class="bg-amber-950 text-amber-100 p-4 font-bold flex justify-between items-center border-b border-amber-900">
                        <h4 class="text-xs uppercase font-extrabold tracking-wider flex items-center gap-1.5">📝 Justificación Requerida</h4>
                    </div>
                    <div class="p-4 space-y-3 text-xs">
                        <p class="text-slate-700 leading-tight">
                            Has realizado una modificación grande (<strong>${Math.abs(delta)} ${unit}</strong>) sobre <strong>"${itemName}"</strong>. Es obligatorio registrar un comentario que justifique esta acción.
                        </p>
                        
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Escribe tu justificación</label>
                            <textarea id="large-adjust-comment" placeholder="Ej: Pérdida por pudrición de cajón / Usado para evento..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 outline-none focus:ring-1 focus:ring-amber-500 font-semibold" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="bg-slate-50 px-4 py-3 border-t border-slate-100 flex justify-end gap-2 text-xs font-bold">
                        <button id="btn-submit-large-adjust" class="bg-amber-800 hover:bg-amber-700 text-white px-4 py-2 rounded-xl shadow-md transition disabled:opacity-50" disabled>Guardar Comentario</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const textarea = document.getElementById('large-adjust-comment');
            const submitBtn = document.getElementById('btn-submit-large-adjust');

            textarea.oninput = (e) => {
                const val = e.target.value.trim();
                submitBtn.disabled = val.length < 5;
            };

            submitBtn.onclick = async () => {
                const comment = textarea.value.trim();
                document.getElementById('large-adjust-modal').remove();
                
                const db = getMockDb();
                const original = db.merchandise.find(m => m.id === merchId);
                const sector = db.sectors.find(s => s.id === original.sector_id);
                const sectorName = sector ? sector.name : 'Desconocido';
                const newQty = oldQty + delta;

                let details = `Cantidad modificada de ${oldQty} a ${newQty} ${unit} por ${userSession.name}.`;
                if (exitReason !== "Ninguno") details += ` [Motivo: ${exitReason}]`;
                details += ` [Nota: "${comment}"]`;

                if (isLiveSupabase && supabaseClient) {
                    const previous = { quantity: oldQty, updated_by: original.updated_by, updated_at: original.updated_at };
                    const { error } = await supabaseClient.from('merchandise').update({
                        quantity: newQty,
                        updated_by: `${userSession.name} (${userSession.code})`,
                        updated_at: new Date().toISOString()
                    }).eq('id', merchId);
                    if (error) {
                        showToast('Error', 'No se pudo guardar el ajuste.', 'error');
                        return;
                    }
                    const auditSaved = await db_insertAuditLog({
                        merchandise_id: merchId,
                        sector_id: original.sector_id,
                        sector_name: sectorName,
                        merchandise_name: original.name,
                        action: 'update',
                        quantity_before: oldQty,
                        quantity_after: newQty,
                        details,
                        user_code: userSession.code,
                        user_name: userSession.name
                    });
                    if (!auditSaved) {
                        await supabaseClient.from('merchandise').update(previous).eq('id', merchId);
                        await fetchAndSyncFromSupabase();
                        return;
                    }
                    await fetchAndSyncFromSupabase();
                } else {
                    original.quantity = newQty;
                    original.updated_by = `${userSession.name} (${userSession.code})`;
                    original.updated_at = new Date().toISOString();

                    const log = {
                        id: 'h-' + Math.random().toString(36).substr(2, 9),
                        merchandise_id: merchId,
                        sector_id: original.sector_id,
                        sector_name: sectorName,
                        merchandise_name: original.name,
                        action: 'update',
                        quantity_before: oldQty,
                        quantity_after: newQty,
                        details: details,
                        user_code: userSession.code,
                        user_name: userSession.name,
                        created_at: new Date().toISOString()
                    };
                    db.inventory_history.push(log);
                    saveMockDb(db);
                }
                showToast("Ajuste Grande Registrado", "Se guardó con comentario explicativo.", "success");
            };
        }

        // --- PURE CLIENT-SIDE EXCEL EXPORT ---
        function exportToExcel() {
            const db = getMockDb();

            const stockData = [];
            db.merchandise.forEach(m => {
                const sector = db.sectors.find(s => s.id === m.sector_id);
                const sectorName = sector ? sector.name : 'Desconocido';
                stockData.push({
                    "Sector": sectorName,
                    "Artículo": m.name,
                    "Cantidad": m.quantity,
                    "Unidad": m.unit === 'kg' ? 'kilos' : 'unidades',
                    "Estado": m.active ? "Activo" : "Dado de baja",
                    "Última Modificación": m.updated_by || "Por Defecto",
                    "Fecha Actualización": new Date(m.updated_at).toLocaleString()
                });
            });

            const historyData = [];
            db.inventory_history.forEach(h => {
                historyData.push({
                    "Fecha y Hora": new Date(h.created_at).toLocaleString(),
                    "Sector": h.sector_name,
                    "Artículo": h.merchandise_name,
                    "Acción": h.action.toUpperCase(),
                    "Cantidad Antes": h.quantity_before !== null ? h.quantity_before : '--',
                    "Cantidad Después": h.quantity_after !== null ? h.quantity_after : '--',
                    "Detalle Completo": h.details,
                    "Código Operador": h.user_code,
                    "Nombre Operador": h.user_name
                });
            });

            const wb = XLSX.utils.book_new();

            const wsStock = XLSX.utils.json_to_sheet(stockData);
            const wsHistory = XLSX.utils.json_to_sheet(historyData);

            XLSX.utils.book_append_sheet(wb, wsStock, "Stock Consolidado");
            XLSX.utils.book_append_sheet(wb, wsHistory, "Historial de Auditoría");

            const fileName = `Reporte_Inventario_${systemSettings.app_name.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0,10)}.xlsx`;
            XLSX.writeFile(wb, fileName);
            showToast("📥 Excel Descargado", "Planilla de control descargada con éxito.", "success");
        }

        function buildAuditRows(logs) {
            return logs.map(h => ({

                "Sector": h.sector_name || 'Sin sector',
                "Artículo": h.merchandise_name || '',
                "Acción": String(h.action || '').toUpperCase(),

        async function copySectorAudit(sectorId) {
            const logs = getSectorAuditLogs(sectorId);
            if (!logs.length) {
                showToast('Sin movimientos', 'Este sector todavía no tiene registros.', 'warning');
                return;
            }
            const rows = buildAuditRows(logs);
            const headers = Object.keys(rows[0]);
            const text = [headers.join('	'), ...rows.map(row => headers.map(h => String(row[h]).replaceAll('	', ' ')).join('	'))].join('\n');
            try {
                await navigator.clipboard.writeText(text);
            } catch {
                const area = document.createElement('textarea');
                area.value = text;
                area.style.position = 'fixed';
                area.style.opacity = '0';
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                area.remove();
            }
            showToast('📋 Auditoría copiada', 'Pegala directamente en Excel o en una planilla.', 'success');
        }

        function exportSectorAuditToExcel(sectorId) {
            const logs = getSectorAuditLogs(sectorId);
            if (!logs.length) {
                showToast('Sin movimientos', 'Este sector todavía no tiene registros.', 'warning');
                return;
            }
            const rows = buildAuditRows(logs);
            const sectorName = logs[0].sector_name || 'Sin_sector';
            const safeName = sectorName.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ_-]+/g, '_').slice(0, 45);
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(rows);
            XLSX.utils.book_append_sheet(wb, ws, 'Auditoría');
            XLSX.writeFile(wb, `Auditoria_${safeName}_${new Date().toISOString().slice(0, 10)}.xlsx`);

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function loadSectorItemDropdown(sectorId) {
            const select = document.getElementById('select-existing-items');
            const nameInput = document.getElementById('new-merch-name');
            const unitSelect = document.getElementById('new-merch-unit');
            if (!select || !nameInput || !unitSelect) return;

            const db = getMockDb();
            const items = db.merchandise
                .filter(m => m.sector_id === sectorId && m.active)
                .sort((a, b) => a.name.localeCompare(b.name));

            let optionsHtml = `<option value="">➕ Crear un artículo nuevo</option>`;
            items.forEach(i => {
                optionsHtml += `<option value="${escapeHtml(i.name)}">📦 ${escapeHtml(i.name)} (${i.unit})</option>`;
            });
            select.innerHTML = optionsHtml;
            nameInput.readOnly = false;
            nameInput.value = '';
            nameInput.classList.remove('bg-slate-100', 'text-slate-500');
            nameInput.classList.add('bg-white', 'text-slate-900');
            unitSelect.disabled = false;

                unitSelect.disabled = false;

            const db = getMockDb();
            const matched = db.merchandise.find(m =>
                m.sector_id === sectorId && m.name.toLowerCase() === value.toLowerCase() && m.active

                            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Nombre Completo del Colaborador</label>
                            <input type="text" id="new-code-name" placeholder="Ej: Juan Pérez" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 focus:ring-1 focus:ring-emerald-700 outline-none font-bold">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Clave de Seguridad (4 a 6 Letras/Números)</label>
                            <input type="text" id="new-code-text" maxlength="6" placeholder="Ej: STF22" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2.5 focus:ring-1 focus:ring-emerald-700 outline-none font-mono uppercase tracking-widest text-center text-sm font-bold">
                            <p class="text-[9px] text-slate-400 mt-1">Obligatorio: Entre 4 y 6 caracteres.</p>
                        </div>
                        ${roleSection}
                        ${sectorSection}
                    </div>
                    <div class="bg-slate-50 px-4 py-3 border-t border-slate-100 flex justify-end gap-2 text-xs font-bold">
                        <button onclick="document.getElementById('dynamic-modal').remove()" class="bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl">Cancelar</button>
                        <button id="btn-submit-new-code" class="bg-slate-950 text-white hover:bg-slate-800 px-3.5 py-2 rounded-xl shadow">Crear Clave 🔐</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('btn-submit-new-code').onclick = async () => {
                const name = document.getElementById('new-code-name').value;
                const codeText = document.getElementById('new-code-text').value;
                const role = document.getElementById('new-code-role').value;
                const sectorVal = document.getElementById('new-code-sector').value;
                const sectorId = sectorVal === "" ? null : sectorVal;

                if (!name || !codeText) {
                    alert("Por favor completa todos los campos del código.");
                    return;
                }

                const inserted = await db_createCode(codeText, name, role, sectorId);
                if (inserted) {
                    showToast("Clave Generada", `Acceso asignado para ${name}.`, "success");
                    document.getElementById('dynamic-modal').remove();
                    if (!isLiveSupabase) renderAllScreens();
                }
            };
        }

        async function openEditCodeModal(codeId, screenContext) {
            let user = null;
            if (screenContext === 'owner') user = activeSessions.owner;
            else if (screenContext === 'admin') user = activeSessions.admin;
            else if (screenContext === 'fullscreen') user = activeSessions.fullscreen;
            if (!user) return;

            const db = getMockDb();
            const target = db.access_codes.find(c => c.id === codeId);
            if (!target) return;

            // Solo el dueño puede otorgar el permiso de gestionar Empleados,
            // y solo tiene sentido dárselo a un código de rango "admin".
            const showEmployeePermToggle = user.role === 'owner' && target.role === 'admin';

            const modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-pop-up";
            modal.id = "dynamic-modal";
            modal.innerHTML = `
                <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full overflow-hidden border border-slate-200">
                    <div class="bg-slate-900 text-white p-4 font-bold flex justify-between items-center border-b border-emerald-950">
                        <h4 class="text-sm font-serif">✏️ Editar Clave de Entrada</h4>
                        <button onclick="document.getElementById('dynamic-modal').remove()" class="text-white hover:text-red-300 font-bold text-lg leading-none">&times;</button>
                    </div>
                    <div class="p-4 space-y-3.5 text-xs">
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Nombre Completo del Colaborador</label>
                            <input type="text" id="edit-code-name" value="${escapeHtml(target.name)}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 focus:ring-1 focus:ring-emerald-700 outline-none font-bold">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Clave de Seguridad (4 a 6 Letras/Números)</label>
                            <input type="text" id="edit-code-text" maxlength="6" value="${escapeHtml(target.code)}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2.5 focus:ring-1 focus:ring-emerald-700 outline-none font-mono uppercase tracking-widest text-center text-sm font-bold">
                            <p class="text-[9px] text-slate-400 mt-1">Obligatorio: Entre 4 y 6 caracteres.</p>
                        </div>
                        ${showEmployeePermToggle ? `
                        <label class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2.5 cursor-pointer">
                            <input type="checkbox" id="edit-code-emp-perm" ${target.can_manage_employees ? 'checked' : ''} class="w-4 h-4 accent-emerald-700">
                            <span class="text-[10px] font-bold text-slate-600">Puede acceder al módulo de Empleados</span>
                        </label>
                        ` : ''}
                    </div>
                    <div class="bg-slate-50 px-4 py-3 border-t border-slate-100 flex justify-end gap-2 text-xs font-bold">
                        <button onclick="document.getElementById('dynamic-modal').remove()" class="bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl">Cancelar</button>
                        <button id="btn-submit-edit-code" class="bg-slate-950 text-white hover:bg-slate-800 px-3.5 py-2 rounded-xl shadow">Guardar Cambios 💾</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('btn-submit-edit-code').onclick = async () => {
                const name = document.getElementById('edit-code-name').value;
                const codeText = document.getElementById('edit-code-text').value;
                const updates = { name, code: codeText };
                if (showEmployeePermToggle) {
                    updates.can_manage_employees = document.getElementById('edit-code-emp-perm').checked;
                }
                const ok = await db_updateAccessCode(codeId, updates, user);
                if (ok) {
                    document.getElementById('dynamic-modal').remove();
                    if (!isLiveSupabase) renderAllScreens();
                }
            };
        }

        // --- SHOW EMBEDDED MODAL ALERTS ---
        function showModalAlert(title, message) {
            const modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-black/75 z-55 flex items-center justify-center p-4 backdrop-blur-sm animate-pop-up";
            modal.id = "alert-modal";
            modal.innerHTML = `
                <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full overflow-hidden border border-red-200">
                    <div class="bg-red-950 text-red-100 p-4 font-bold flex justify-between items-center border-b border-red-900">
                        <h4 class="text-xs uppercase font-extrabold tracking-wider flex items-center gap-1.5">🚨 ${title}</h4>
                        <button onclick="document.getElementById('alert-modal').remove()" class="text-red-300 hover:text-white font-bold text-lg leading-none">&times;</button>
                    </div>
                    <div class="p-5 text-slate-700 text-xs leading-relaxed space-y-2">
                        <p>${message}</p>
                    </div>
                    <div class="bg-slate-50 px-4 py-3 border-t border-slate-100 flex justify-end text-xs font-bold">
                        <button onclick="document.getElementById('alert-modal').remove()" class="bg-red-900 text-white hover:bg-red-800 px-4 py-2 rounded-xl shadow-md">
                            Entendido 🆗
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // --- TOAST SYSTEMS ---
        function showToast(title, message, type = "info") {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            let colors = "bg-white border-l-4 border-emerald-800 text-slate-800";
            if (type === "success") colors = "bg-emerald-950 text-white border-l-4 border-emerald-400";
            else if (type === "error") colors = "bg-red-950 text-red-100 border-l-4 border-red-500";
            else if (type === "warning") colors = "bg-amber-100 text-amber-950 border-l-4 border-amber-500";

            toast.className = `p-3 rounded-xl shadow-xl max-w-xs w-80 text-xs flex justify-between items-start gap-2.5 transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto ${colors}`;
            toast.innerHTML = `
                <div>
                    <strong class="font-extrabold block mb-0.5">${title}</strong>
                    <span>${message}</span>
                </div>
                <button class="font-bold opacity-60 hover:opacity-100 leading-none">&times;</button>
            `;

            container.appendChild(toast);
            
            toast.querySelector('button').onclick = () => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            };

            setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-2'), 40);
            setTimeout(() => { if (toast.parentNode) { toast.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => toast.remove(), 300); } }, 4000);
        }

        // --- FULLSCREEN LOGIN / LOGOUT HANDLERS (FUNCIONES QUE FALTABAN) ---
        async function handleFullscreenLogin() {
            const firstName = document.getElementById('fs-login-first')?.value.trim();
            const lastName = document.getElementById('fs-login-last')?.value.trim();
            const code = document.getElementById('fs-login-code')?.value.trim();

            if (!firstName || !lastName || !code) {
                showToast("Campos incompletos", "Por favor completa todos los campos para ingresar.", "warning");
                return;
            }

            if (code.length < 4 || code.length > 6) {
                showToast("Código Inválido", "El código debe tener entre 4 y 6 caracteres.", "warning");
                return;
            }

            const session = await db_validateCode(code, firstName, lastName);

            if (!session) {
                showToast("Código Inválido", "El código ingresado no es válido o está desactivado. Verifica con tu administrador.", "error");
                return;
            }
            if (session.error === 'name_mismatch') {
                showToast("Nombre incorrecto", "El nombre y apellido no coinciden con la persona asignada a este código.", "error");
                return;
            }

            activeSessions.fullscreen = session;
            renderFullscreenScreen();
            showToast("Ingreso Exitoso", `Bienvenido/a ${session.name}. Has accedido como ${formatRoleLabel(session.role)}.`, "success");
        }

        function handleFullscreenLogout() {
            activeSessions.fullscreen = null;
            renderFullscreenScreen();
            showToast("Sesión Cerrada", "Has salido del sistema de inventario.", "info");
        }

    </script>
</body>
