            }
            return JSON.parse(db);
        }

        function saveMockDb(db) {

            // Trigger local sync event
            window.dispatchEvent(new CustomEvent('agua-verde-realtime-update-pro'));

        // ==========================================
        // ACTIVE SESSION STATE
        // ==========================================

            owner: { code: 'DUE12', name: 'Don Roberto', first_name: 'Don', last_name: 'Roberto', role: 'owner', sector_id: null, can_view_all: true },
            admin: { code: 'ADM11', name: 'Clara Gómez', first_name: 'Clara', last_name: 'Gómez', role: 'admin', sector_id: '11111111-1111-1111-1111-111111111111', can_view_all: false },
            staff: { code: 'STF11', name: 'Mateo Ruiz', first_name: 'Mateo', last_name: 'Ruiz', role: 'staff', sector_id: '11111111-1111-1111-1111-111111111111', can_view_all: false },
            fullscreen: null // Logs in dynamically
        };

        // Screen Active Tabs
        let activeTabs = {
            owner: 'inventory', // inventory, history, codes, sectors, config
            admin: 'inventory', // inventory, codes, history
            staff: 'inventory'
        };

                renderAllScreens();

        // Load Settings from Local/Supabase config
        async function loadSettings() {
            let stored = localStorage.getItem('agua_verde_settings');
            if (stored) {
                systemSettings = JSON.parse(stored);
            } else {
                localStorage.setItem('agua_verde_settings', JSON.stringify(systemSettings));
            }

            // Sync with Supabase settings table if connected
            if (isLiveSupabase && supabaseClient) {
                try {
                    const { data, error } = await supabaseClient.from('app_settings').select('val').eq('id', 'config').single();
                    if (data && data.val) {
                        systemSettings = data.val;
                        localStorage.setItem('agua_verde_settings', JSON.stringify(systemSettings));
                    }
                } catch (e) {
                    console.error("Error al cargar settings desde Supabase:", e);
                }
            }

            updateDynamicAppBranding();
        }

        function updateDynamicAppBranding() {
            document.title = `${systemSettings.app_name} — Inventario Realtime PRO`;
            const headerTitle = document.getElementById('app-main-title');
            if (headerTitle) headerTitle.innerText = systemSettings.app_name;

            sublabels.forEach(lbl => {
                lbl.innerText = `🌿 ${systemSettings.app_name}`;
            });

        function initSupabaseClient() {
            let url = localStorage.getItem('SUPABASE_URL');
            let key = localStorage.getItem('SUPABASE_KEY');
            
            // Credenciales incrustadas de Don Roberto (Agua Verde)
            if (!url) {
                url = 'https://rlstizjvlreskttbzsza.supabase.co';
                localStorage.setItem('SUPABASE_URL', url);
            }
            if (!key) {
                key = 'sb_publishable_7wGCQASPYs3i7skA0HusKQ_vnYOqS-m';
                localStorage.setItem('SUPABASE_KEY', key);
            }
            
            const badge = document.getElementById('db-status-badge');
            const bannerText = document.getElementById('status-text');
            const fsBadge = document.getElementById('fs-badge');

                try {
                    supabaseClient = supabase.createClient(url, key);
                    isLiveSupabase = true;

        // Live Database Realtime listeners
        function setupSupabaseRealtime() {
            if (!supabaseClient) return;

            supabaseClient.channel('agua-verde-channel-pro')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'merchandise' }, () => scheduleSupabaseSync())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory_history' }, () => scheduleSupabaseSync())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'access_codes' }, () => scheduleSupabaseSync())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'sectors' }, () => scheduleSupabaseSync())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, () => {
                    loadSettings();
                    scheduleSupabaseSync();
                })
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        showToast("Sincronización Activa 📡", "Conectado a la base de datos de Agua Verde.", "success");
                    }
                });
        }

        function scheduleSupabaseSync(delay = 250) {
            clearTimeout(realtimeSyncTimer);
            realtimeSyncTimer = setTimeout(() => fetchAndSyncFromSupabase(), delay);
        }

        async function fetchAndSyncFromSupabase() {
            if (!isLiveSupabase || !supabaseClient) return false;
            const requestId = ++latestSyncRequest;

            try {
                const [sectorsResult, codesResult, merchResult, historyResult] = await Promise.all([
                    supabaseClient.from('sectors').select('*').order('name', { ascending: true }),
                    supabaseClient.from('access_codes').select('*'),
                    supabaseClient.from('merchandise').select('*'),
                    supabaseClient.from('inventory_history').select('*').order('created_at', { ascending: false })
                ]);

                // Prevent an older, slower request from overwriting fresher data.
                if (requestId !== latestSyncRequest) return false;

                const current = getMockDb();
                const results = [sectorsResult, codesResult, merchResult, historyResult];
                const errors = results.map(r => r.error).filter(Boolean);
                errors.forEach(error => console.error('Error parcial de sincronización Supabase:', error));

                const dbObj = {
                    sectors: sectorsResult.error ? current.sectors : (sectorsResult.data || []),
                    access_codes: codesResult.error ? current.access_codes : (codesResult.data || []),
                    merchandise: merchResult.error ? current.merchandise : (merchResult.data || []),
                    inventory_history: historyResult.error ? current.inventory_history : (historyResult.data || [])
                };

                localStorage.setItem('agua_verde_db_pro', JSON.stringify(dbObj));
                renderAllScreens();
                return errors.length === 0;
            } catch (err) {
                console.error('Error en sincronización Supabase:', err);
                return false;
            }
        }


        // ==========================================
        // DATABASE WRAPPER API (PRO FEATURES)
        // ==========================================

        function createUuid() {
            if (crypto?.randomUUID) return crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        }

        async function db_insertAuditLog(logData, retries = 3) {
            if (!isLiveSupabase || !supabaseClient) return null;
            const payload = { id: logData.id || createUuid(), ...logData };
            let lastError = null;

            for (let attempt = 1; attempt <= retries; attempt++) {
                const { data, error } = await supabaseClient
                    .from('inventory_history')
                    .insert([payload])
                    .select()
                    .single();
                if (!error) return data;
                // A duplicated UUID means a previous timed-out request actually succeeded.
                if (error.code === '23505') return payload;
                lastError = error;
                if (attempt < retries) await new Promise(resolve => setTimeout(resolve, 350 * attempt));
            }

            console.error('No se pudo guardar la auditoría:', lastError);
            showToast('Auditoría no guardada', 'La operación fue detenida para no dejar el inventario sin registro.', 'error');
            return null;
        }

        function assignedPersonName(value) {
            return String(value || '')
                .replace(/\s*\((dueño|dueno|owner|admin|administrador|personal|staff)\)\s*$/i, '')
                .trim();
        }

        function normalizePersonName(value) {
            return assignedPersonName(value)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, ' ')
                .trim()
                .replace(/\s+/g, ' ');
        }

        async function db_validateCode(code, inputFirstName, inputLastName) {
            const cleanCode = code.trim().toUpperCase();
            const enteredName = `${inputFirstName.trim()} ${inputLastName.trim()}`;

            if (isLiveSupabase && supabaseClient) {
                const { data, error } = await supabaseClient
                    .from('access_codes')
                    .select('*')
                    .eq('code', cleanCode)
                    .eq('active', true)
                    .single();

                if (error || !data) return null;
                const registeredName = assignedPersonName(data.name);
                if (normalizePersonName(enteredName) !== normalizePersonName(registeredName)) {
                    return { error: 'name_mismatch' };
                }
                const parts = registeredName.split(/\s+/);
                return {
                    code: data.code,
                    name: registeredName,
                    first_name: parts[0] || '',
                    last_name: parts.slice(1).join(' '),
                    role: data.role,
                    sector_id: data.sector_id,
                    can_view_all: data.can_view_all
                };
            }

            const db = getMockDb();
            const found = db.access_codes.find(c => c.code.toUpperCase() === cleanCode && c.active);
            if (!found) return null;
            const registeredName = assignedPersonName(found.name);
            if (normalizePersonName(enteredName) !== normalizePersonName(registeredName)) {
                return { error: 'name_mismatch' };
            }
            const parts = registeredName.split(/\s+/);
            return {
                code: found.code,
                name: registeredName,
                first_name: parts[0] || '',
                last_name: parts.slice(1).join(' '),
                role: found.role,
                sector_id: found.sector_id,
                can_view_all: found.can_view_all
            };
        }

        async function db_getSectors() {
            const db = getMockDb();

        async function db_updateQuantity(merchId, delta, userSession, exitReason = "Ninguno", comment = "") {
            const db = getMockDb();
            const original = db.merchandise.find(m => m.id === merchId);
            if (!original) return false;

            const oldQty = parseFloat(original.quantity);
            const newQty = oldQty + delta;
            const previousUpdatedBy = original.updated_by;
            const previousUpdatedAt = original.updated_at;

            // 1. BLOCK NEGATIVE STOCKS
            if (newQty < 0) {
                showModalAlert("❌ Saldo Insuficiente", `Acción Bloqueada: No puedes retirar más mercadería de la existente en el inventario.<br><br><strong>Artículo:</strong> ${original.name}<br><strong>Stock Actual:</strong> ${oldQty} ${original.unit}<br><strong>Intento de retiro:</strong> ${Math.abs(delta)} ${original.unit}`);
                return false;
            }

            // 2. LARGE ADJUSTMENT REQUIRED COMMENT CHECK
            const absDelta = Math.abs(delta);
            if (absDelta >= systemSettings.large_adjustment_threshold && !comment.trim()) {
                openLargeAdjustmentPrompt(merchId, delta, userSession, exitReason, oldQty, original.name, original.unit);
                return false;
            }

            const sector = db.sectors.find(s => s.id === original.sector_id);
            const sectorName = sector ? sector.name : 'Desconocido';

            let details = `Cantidad modificada de ${oldQty} a ${newQty} ${original.unit} por ${userSession.name}.`;
            if (exitReason !== "Ninguno") {
                details += ` [Motivo de egreso: ${exitReason}]`;
            }
            if (comment.trim()) {
                details += ` [Nota: "${comment.trim()}"]`;
            }

            if (isLiveSupabase && supabaseClient) {
                const { error } = await supabaseClient
                    .from('merchandise')
                    .update({ 
                        quantity: newQty, 
                        updated_by: `${userSession.name} (${userSession.code})`,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', merchId);

                if (error) {
                    showToast("Error", "Error al actualizar stock.", "error");
                    return false;
                }

                const auditSaved = await db_insertAuditLog({
                    merchandise_id: merchId,
                    sector_id: original.sector_id,
                    sector_name: sectorName,
                    merchandise_name: original.name,
                    action: 'update',
                    quantity_before: oldQty,
                    quantity_after: newQty,
                    details,
                    user_code: userSession.code,
                    user_name: userSession.name
                });

                if (!auditSaved) {
                    await supabaseClient.from('merchandise').update({
                        quantity: oldQty,
                        updated_by: previousUpdatedBy,
                        updated_at: previousUpdatedAt
                    }).eq('id', merchId);
                    await fetchAndSyncFromSupabase();
                    return false;
                }
                await fetchAndSyncFromSupabase();
            } else {
                original.quantity = newQty;
                original.updated_by = `${userSession.name} (${userSession.code})`;
                original.updated_at = new Date().toISOString();

                const log = {
                    id: 'h-' + Math.random().toString(36).substr(2, 9),
                    merchandise_id: merchId,
                    sector_id: original.sector_id,
                    sector_name: sectorName,
                    merchandise_name: original.name,
                    action: 'update',
                    quantity_before: oldQty,
                    quantity_after: newQty,
                    details: details,
                    user_code: userSession.code,
                    user_name: userSession.name,
                    created_at: new Date().toISOString()
                };

                db.inventory_history.push(log);
                saveMockDb(db);
            }
            return true;
        }

        async function db_transferMerchandise(merchId, targetSectorId, qtyVal, userSession, comment = "") {
            const transferQty = parseFloat(qtyVal);
            if (isNaN(transferQty) || transferQty <= 0) {
                showToast("Cantidad inválida", "La cantidad a traspasar debe ser mayor a cero.", "warning");
                return false;
            }

            const db = getMockDb();
            const sourceItem = db.merchandise.find(m => m.id === merchId);
            if (!sourceItem) return false;

            const oldSourceQty = parseFloat(sourceItem.quantity);
            if (oldSourceQty < transferQty) {
                showModalAlert("❌ Traspaso Fallido", `No hay suficiente stock en tu sector para realizar el traspaso.<br><br><strong>Disponible:</strong> ${oldSourceQty} ${sourceItem.unit}<br><strong>Intentado:</strong> ${transferQty} ${sourceItem.unit}`);
                return false;
            }

            const sourceSec = db.sectors.find(s => s.id === sourceItem.sector_id);
            const sourceSecName = sourceSec ? sourceSec.name : 'Sector de Origen';
            const targetSec = db.sectors.find(s => s.id === targetSectorId);
            const targetSecName = targetSec ? targetSec.name : 'Sector de Destino';
            const newSourceQty = oldSourceQty - transferQty;
            const targetItem = db.merchandise.find(m => m.sector_id === targetSectorId && m.name.toLowerCase() === sourceItem.name.toLowerCase() && m.active);
            const targetBefore = targetItem ? parseFloat(targetItem.quantity) : 0;
            const targetAfter = targetBefore + transferQty;

            let logDetails = `Traspaso: Se enviaron ${transferQty} ${sourceItem.unit} desde "${sourceSecName}" hacia "${targetSecName}" por ${userSession.name}.`;
            if (comment.trim()) logDetails += ` [Nota: "${comment.trim()}"]`;

            if (isLiveSupabase && supabaseClient) {
                const sourcePrevious = { updated_by: sourceItem.updated_by, updated_at: sourceItem.updated_at };
                const { error: sourceError } = await supabaseClient.from('merchandise').update({
                    quantity: newSourceQty,
                    updated_by: `${userSession.name} (${userSession.code})`,
                    updated_at: new Date().toISOString()
                }).eq('id', merchId);
                if (sourceError) {
                    showToast('Error', 'No se pudo actualizar el sector de origen.', 'error');
                    return false;
                }

                let targetMerchId = targetItem?.id || null;
                let createdTarget = false;
                if (targetItem) {
                    const { error: targetError } = await supabaseClient.from('merchandise').update({
                        quantity: targetAfter,
                        updated_by: `${userSession.name} (${userSession.code})`,
                        updated_at: new Date().toISOString()
                    }).eq('id', targetItem.id);
                    if (targetError) {
                        await supabaseClient.from('merchandise').update({ quantity: oldSourceQty, ...sourcePrevious }).eq('id', merchId);
                        showToast('Error', 'No se pudo actualizar el sector de destino.', 'error');
                        return false;
                    }
                } else {
                    const { data: insertedTarget, error: targetError } = await supabaseClient.from('merchandise').insert([{
                        sector_id: targetSectorId,
                        name: sourceItem.name,
                        quantity: transferQty,
                        unit: sourceItem.unit,
                        active: true,
                        updated_by: `${userSession.name} (${userSession.code})`
                    }]).select().single();
                    if (targetError || !insertedTarget) {
                        await supabaseClient.from('merchandise').update({ quantity: oldSourceQty, ...sourcePrevious }).eq('id', merchId);
                        showToast('Error', 'No se pudo crear el artículo en el sector de destino.', 'error');
                        return false;
                    }
                    targetMerchId = insertedTarget.id;
                    createdTarget = true;
                }

                const rollbackTransfer = async () => {
                    await supabaseClient.from('merchandise').update({ quantity: oldSourceQty, ...sourcePrevious }).eq('id', merchId);
                    if (createdTarget) await supabaseClient.from('merchandise').delete().eq('id', targetMerchId);
                    else await supabaseClient.from('merchandise').update({
                        quantity: targetBefore,
                        updated_by: targetItem.updated_by,
                        updated_at: targetItem.updated_at
                    }).eq('id', targetMerchId);
                };

                const sourceAudit = await db_insertAuditLog({
                    merchandise_id: merchId,
                    sector_id: sourceItem.sector_id,
                    sector_name: sourceSecName,
                    merchandise_name: sourceItem.name,
                    action: 'transfer',
                    quantity_before: oldSourceQty,
                    quantity_after: newSourceQty,
                    details: logDetails,
                    user_code: userSession.code,
                    user_name: userSession.name
                });
                if (!sourceAudit) {
                    await rollbackTransfer();
                    await fetchAndSyncFromSupabase();
                    return false;
                }

                const targetAudit = await db_insertAuditLog({
                    merchandise_id: targetMerchId,
                    sector_id: targetSectorId,
                    sector_name: targetSecName,
                    merchandise_name: sourceItem.name,
                    action: 'transfer',
                    quantity_before: targetBefore,
                    quantity_after: targetAfter,
                    details: `Ingreso por traspaso: ${transferQty} ${sourceItem.unit} desde "${sourceSecName}" por ${userSession.name}.`,
                    user_code: userSession.code,
                    user_name: userSession.name
                });
                if (!targetAudit) {
                    await supabaseClient.from('inventory_history').delete().eq('id', sourceAudit.id);
                    await rollbackTransfer();
                    await fetchAndSyncFromSupabase();
                    return false;
                }

                await fetchAndSyncFromSupabase();
            } else {
                sourceItem.quantity = newSourceQty;
                sourceItem.updated_by = `${userSession.name} (${userSession.code})`;
                sourceItem.updated_at = new Date().toISOString();

                let targetMerchId;
                if (targetItem) {
                    targetItem.quantity = targetAfter;
                    targetItem.updated_by = `${userSession.name} (${userSession.code})`;
                    targetItem.updated_at = new Date().toISOString();
                    targetMerchId = targetItem.id;
                } else {
                    const freshItem = {
                        id: 'm-' + Math.random().toString(36).substr(2, 9),
                        sector_id: targetSectorId,
                        name: sourceItem.name,
                        quantity: transferQty,
                        unit: sourceItem.unit,
                        active: true,
                        updated_by: `${userSession.name} (${userSession.code})`,
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    };
                    db.merchandise.push(freshItem);
                    targetMerchId = freshItem.id;
                }

                db.inventory_history.push({
                    id: 'h-' + Math.random().toString(36).substr(2, 9),
                    merchandise_id: merchId,
                    sector_id: sourceItem.sector_id,
                    sector_name: sourceSecName,
                    merchandise_name: sourceItem.name,
                    action: 'transfer',
                    quantity_before: oldSourceQty,
                    quantity_after: newSourceQty,
                    details: logDetails,
                    user_code: userSession.code,
                    user_name: userSession.name,
                    created_at: new Date().toISOString()
                }, {
                    id: 'h-' + Math.random().toString(36).substr(2, 9),
                    merchandise_id: targetMerchId,
                    sector_id: targetSectorId,
                    sector_name: targetSecName,
                    merchandise_name: sourceItem.name,
                    action: 'transfer',
                    quantity_before: targetBefore,
                    quantity_after: targetAfter,
                    details: `Ingreso por traspaso: ${transferQty} ${sourceItem.unit} desde "${sourceSecName}" por ${userSession.name}.`,
                    user_code: userSession.code,
                    user_name: userSession.name,
                    created_at: new Date().toISOString()
                });
                saveMockDb(db);
            }
            return true;
        }

            if (userSession.role !== 'owner' && item.sector_id !== userSession.sector_id) {
                showToast('Acceso denegado', 'Solo podés borrar artículos de tu sector.', 'error');
                return false;
            }

            const sector = db.sectors.find(s => s.id === item.sector_id);
            const sectorName = sector ? sector.name : 'Desconocido';
            const details = `Baja lógica realizada por ${userSession.name}. Motivo: ${reason || 'Sin detalle'}`;

            if (isLiveSupabase && supabaseClient) {
                const previous = { active: item.active, updated_by: item.updated_by, updated_at: item.updated_at };
                const { error } = await supabaseClient.from('merchandise').update({
                    active: false,
                    updated_by: `${userSession.name} (${userSession.code})`,
                    updated_at: new Date().toISOString()

                    showToast('Error', 'No se pudo dar de baja el artículo.', 'error');
                    return false;

                const auditSaved = await db_insertAuditLog({
                    merchandise_id: merchId,
                    sector_id: item.sector_id,
                    sector_name: sectorName,
                    merchandise_name: item.name,
                    action: 'delete',
                    quantity_before: item.quantity,
                    quantity_after: 0,
                    details,
                    user_code: userSession.code,
                    user_name: userSession.name
                });
                if (!auditSaved) {
                    await supabaseClient.from('merchandise').update(previous).eq('id', merchId);
                    await fetchAndSyncFromSupabase();
                    return false;
                }
                await fetchAndSyncFromSupabase();
            } else {
                item.active = false;
                item.updated_by = `${userSession.name} (${userSession.code})`;
                item.updated_at = new Date().toISOString();
                db.inventory_history.push({

                    user_code: userSession.code,
                    user_name: userSession.name,
                    created_at: new Date().toISOString()
                });
                saveMockDb(db);
            }
            return true;
        }

        async function db_createCode(codeText, name, role, sectorId) {
            const cleanCode = codeText.trim().toUpperCase();
            
            if (cleanCode.length < 4 || cleanCode.length > 6) {
                showModalAlert("⚠️ Código Inválido", "Error: El código de acceso debe tener obligatoriamente entre 4 y 6 caracteres.");
                return null;
            }

            const db = getMockDb();
            const exists = db.access_codes.find(c => c.code.toUpperCase() === cleanCode);
            if (exists) {
                showToast("Duplicado", "Este código ya está asignado.", "warning");
                return null;
            }

            const newCode = {
                code: cleanCode,
                name: name.trim(),
                role: role,
                sector_id: sectorId,
                active: true,
                can_view_all: role === 'owner'
            };

            if (isLiveSupabase && supabaseClient) {
                const { data, error } = await supabaseClient.from('access_codes').insert([newCode]).select().single();
                if (error) {
                    showToast("Error", "No se pudo registrar la clave.", "error");
                    return null;
                }
                fetchAndSyncFromSupabase();
                return data;
            } else {
                newCode.id = 'c-' + Math.random().toString(36).substr(2, 9);
                newCode.created_at = new Date().toISOString();
                db.access_codes.push(newCode);
                saveMockDb(db);
                return newCode;
            }
        }

        async function db_toggleCodeActive(codeId, currentStatus) {
            const db = getMockDb();
            const newStatus = !currentStatus;

            if (isLiveSupabase && supabaseClient) {
                await supabaseClient.from('access_codes').update({ active: newStatus }).eq('id', codeId);
                fetchAndSyncFromSupabase();
            } else {
                const target = db.access_codes.find(c => c.id === codeId);
                if (target) {
                    target.active = newStatus;
                    saveMockDb(db);
                }
            }
        }

        async function setTab(screen, tabName) {
            activeTabs[screen] = tabName;
            if (screen === 'owner' && tabName === 'history' && isLiveSupabase) {
                await fetchAndSyncFromSupabase();
            } else {
                renderAllScreens();
            }
        }

        function setOwnerSectorFilter(value) {
            ownerSelectedSectorFilter = value;
            renderOwnerScreen();
        }

        function switchAppMode(mode) {
            currentAppDisplayMode = mode;
            
            const btnSim = document.getElementById('btn-mode-simulator');
            const btnFull = document.getElementById('btn-mode-fullscreen');
            
            const sectionSim = document.getElementById('section-simulator');
            const sectionFull = document.getElementById('section-fullscreen');

            if (mode === 'simulator') {
                btnSim.className = "px-3.5 py-2 rounded-lg text-xs font-bold transition-all bg-[#198754] text-white shadow";
                btnFull.className = "px-3.5 py-2 rounded-lg text-xs font-bold transition-all text-emerald-200 hover:text-white";
                sectionSim.classList.remove('hidden');
                sectionSim.classList.add('flex');
                sectionFull.classList.remove('flex');
                sectionFull.classList.add('hidden');
            } else {
                btnSim.className = "px-3.5 py-2 rounded-lg text-xs font-bold transition-all text-emerald-200 hover:text-white";
                btnFull.className = "px-3.5 py-2 rounded-lg text-xs font-bold transition-all bg-[#198754] text-white shadow";
                sectionSim.classList.add('hidden');
                sectionSim.classList.remove('flex');
                sectionFull.classList.add('flex');
                sectionFull.classList.remove('hidden');
            }
            renderAllScreens();
        }

        function toggleConfigModal(show) {
            const modal = document.getElementById('modal-config');
            if (show) {
                document.getElementById('input-sb-url').value = localStorage.getItem('SUPABASE_URL') || '';
                document.getElementById('input-sb-key').value = localStorage.getItem('SUPABASE_KEY') || '';
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function saveSupabaseConfig() {
            const url = document.getElementById('input-sb-url').value.trim();

        function openLargeAdjustmentPrompt(merchId, delta, userSession, exitReason, oldQty, itemName, unit) {
            const modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-black/80 z-55 flex items-center justify-center p-4 backdrop-blur-sm animate-pop-up";
            modal.id = "large-adjust-modal";

                        <button id="btn-submit-large-adjust" class="bg-amber-800 hover:bg-amber-700 text-white px-4 py-2 rounded-xl shadow-md transition disabled:opacity-50" disabled>Guardar Comentario</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const textarea = document.getElementById('large-adjust-comment');
            const submitBtn = document.getElementById('btn-submit-large-adjust');

            textarea.oninput = (e) => {
                const val = e.target.value.trim();
                submitBtn.disabled = val.length < 5;
            };

            submitBtn.onclick = async () => {
                const comment = textarea.value.trim();
                document.getElementById('large-adjust-modal').remove();
                
                const db = getMockDb();
                const original = db.merchandise.find(m => m.id === merchId);
                const sector = db.sectors.find(s => s.id === original.sector_id);
                const sectorName = sector ? sector.name : 'Desconocido';
                const newQty = oldQty + delta;

                let details = `Cantidad modificada de ${oldQty} a ${newQty} ${unit} por ${userSession.name}.`;
                if (exitReason !== "Ninguno") details += ` [Motivo: ${exitReason}]`;
                details += ` [Nota: "${comment}"]`;

                if (isLiveSupabase && supabaseClient) {
                    const previous = { quantity: oldQty, updated_by: original.updated_by, updated_at: original.updated_at };
                    const { error } = await supabaseClient.from('merchandise').update({
                        quantity: newQty,
                        updated_by: `${userSession.name} (${userSession.code})`,
                        updated_at: new Date().toISOString()
                    }).eq('id', merchId);
                    if (error) {
                        showToast('Error', 'No se pudo guardar el ajuste.', 'error');
                        return;
                    }
                    const auditSaved = await db_insertAuditLog({
                        merchandise_id: merchId,
                        sector_id: original.sector_id,
                        sector_name: sectorName,
                        merchandise_name: original.name,
                        action: 'update',
                        quantity_before: oldQty,
                        quantity_after: newQty,
                        details,
                        user_code: userSession.code,
                        user_name: userSession.name
                    });
                    if (!auditSaved) {
                        await supabaseClient.from('merchandise').update(previous).eq('id', merchId);
                        await fetchAndSyncFromSupabase();
                        return;
                    }
                    await fetchAndSyncFromSupabase();
                } else {
                    original.quantity = newQty;
                    original.updated_by = `${userSession.name} (${userSession.code})`;
                    original.updated_at = new Date().toISOString();

                    const log = {
                        id: 'h-' + Math.random().toString(36).substr(2, 9),
                        merchandise_id: merchId,
                        sector_id: original.sector_id,
                        sector_name: sectorName,
                        merchandise_name: original.name,
                        action: 'update',
                        quantity_before: oldQty,
                        quantity_after: newQty,
                        details: details,
                        user_code: userSession.code,
                        user_name: userSession.name,
                        created_at: new Date().toISOString()
                    };
                    db.inventory_history.push(log);
                    saveMockDb(db);
                }
                showToast("Ajuste Grande Registrado", "Se guardó con comentario explicativo.", "success");
            };
        }

        function exportToExcel() {
            const db = getMockDb();

            const stockData = [];
            db.merchandise.forEach(m => {
                const sector = db.sectors.find(s => s.id === m.sector_id);
                const sectorName = sector ? sector.name : 'Desconocido';
                stockData.push({
                    "Sector": sectorName,
                    "Artículo": m.name,
                    "Cantidad": m.quantity,
                    "Unidad": m.unit === 'kg' ? 'kilos' : 'unidades',
                    "Estado": m.active ? "Activo" : "Dado de baja",

                    "Fecha Actualización": new Date(m.updated_at).toLocaleString()
                });
            });

            const historyData = [];
            db.inventory_history.forEach(h => {
                historyData.push({
                    "Fecha y Hora": new Date(h.created_at).toLocaleString(),
                    "Sector": h.sector_name,
                    "Artículo": h.merchandise_name,
                    "Acción": h.action.toUpperCase(),
                    "Cantidad Antes": h.quantity_before !== null ? h.quantity_before : '--',

        async function copySectorAudit(sectorId) {
            const logs = getSectorAuditLogs(sectorId);
            if (!logs.length) {
                showToast('Sin movimientos', 'Este sector todavía no tiene registros.', 'warning');
                return;
            }
            const rows = buildAuditRows(logs);
            const headers = Object.keys(rows[0]);
            const text = [headers.join('	'), ...rows.map(row => headers.map(h => String(row[h]).replaceAll('	', ' ')).join('	'))].join('\n');
            try {
                await navigator.clipboard.writeText(text);
            } catch {
                const area = document.createElement('textarea');
                area.value = text;
                area.style.position = 'fixed';
                area.style.opacity = '0';
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                area.remove();
            }
            showToast('📋 Auditoría copiada', 'Pegala directamente en Excel o en una planilla.', 'success');
        }

        function exportSectorAuditToExcel(sectorId) {

            if (user.role === 'owner' || user.can_view_all) {
                sectorSection = `
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Sector Responsable</label>
                        <select id="new-merch-sector" onchange="loadSectorItemDropdown(this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 text-xs focus:ring-1 focus:ring-emerald-700 outline-none font-semibold">
                            ${sectors.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
                        </select>
                    </div>
                `;
            } else {
                const userSecName = sectors.find(s => s.id === user.sector_id)?.name || 'Tu Sector';
                sectorSection = `
                    <input type="hidden" id="new-merch-sector" value="${user.sector_id}">
                    <div class="text-[11px] bg-slate-100 p-2.5 rounded-xl text-slate-700 font-bold">
                        Área de Registro: ${userSecName}
                    </div>
                `;
            }

            const modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-black/70 z-50 flex items-start sm:items-center justify-center p-4 overflow-y-auto backdrop-blur-sm animate-pop-up";
            modal.id = "dynamic-modal";
            modal.innerHTML = `
                <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full max-h-[calc(100dvh-2rem)] overflow-y-auto border border-slate-200">
                    <div class="bg-[#0f5132] text-white p-4 font-bold flex justify-between items-center border-b border-[#0dcaf0]/20">
                        <h4 class="text-sm font-serif">Registrar Stock</h4>
                        <button onclick="document.getElementById('dynamic-modal').remove()" class="text-white hover:text-red-300 font-bold text-lg leading-none">&times;</button>
                    </div>
                    <div class="p-4 space-y-3.5 text-xs">
                        ${sectorSection}
                        
                        <div class="space-y-2">
                            <label class="block text-[10px] font-bold uppercase text-slate-500">Artículo existente (opcional)</label>
                            <select id="select-existing-items" onchange="handleExistingItemSelectChange(this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none font-bold text-slate-700">
                            </select>

                            <label for="new-merch-name" class="block text-[10px] font-bold uppercase text-slate-500 pt-1">Nombre del artículo nuevo</label>
                            <input type="text" id="new-merch-name" name="new-merch-name" autocomplete="off" autocapitalize="sentences" enterkeyhint="next" placeholder="Ej.: Azúcar, arroz, detergente..." class="w-full bg-white border-2 border-emerald-300 rounded-xl px-3 py-3 focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 outline-none font-bold text-slate-900">
                            <p id="new-merch-name-help" class="text-[9px] text-slate-500">Escribí aquí para crear un artículo, o elegí uno existente arriba para sumarle cantidad.</p>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Stock Inicial / Cantidad</label>
                                <input type="number" id="new-merch-quantity" value="0" min="0" step="any" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 focus:ring-1 focus:ring-emerald-700 outline-none font-semibold">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Tipo de Medida</label>
                                <select id="new-merch-unit" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 focus:ring-1 focus:ring-emerald-700 outline-none font-bold">
                                    <option value="kg">⚖️ Kilos (kg)</option>
                                    <option value="u">📦 Unidades (u)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-50 px-4 py-3 border-t border-slate-100 flex justify-end gap-2 text-xs font-bold">
                        <button onclick="document.getElementById('dynamic-modal').remove()" class="bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl">Cancelar</button>
                        <button id="btn-submit-new-merch" class="bg-[#0f5132] text-white hover:bg-emerald-800 px-3.5 py-2 rounded-xl shadow">Confirmar Alta</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const activeSectorId = user.role === 'owner' || user.can_view_all ? sectors[0]?.id : user.sector_id;
            loadSectorItemDropdown(activeSectorId);

            document.getElementById('btn-submit-new-merch').onclick = async () => {
                const selectElement = document.getElementById('select-existing-items');
                const nameInput = document.getElementById('new-merch-name');
                let name = (selectElement.value || nameInput.value).trim();

                if (!name) {
                    showToast("Falta el artículo", "Escribí el nombre del artículo o seleccioná uno existente.", "warning");
                    nameInput.focus();
                    return;
                }

                const qtyVal = document.getElementById('new-merch-quantity').value;
                const unit = document.getElementById('new-merch-unit').value;
                const sectorId = document.getElementById('new-merch-sector').value;

                const db = getMockDb();
                const existingItem = db.merchandise.find(m => m.sector_id === sectorId && m.name.toLowerCase() === name.trim().toLowerCase() && m.active);
                
                if (existingItem) {
                    const addQty = parseFloat(qtyVal);
                    await db_updateQuantity(existingItem.id, addQty, user, "Ninguno", "Ingreso de mercadería por alta recurrente");
                    showToast("Carga Exitosa", `Se agregaron ${addQty} ${unit} a "${existingItem.name}".`, "success");
                    document.getElementById('dynamic-modal').remove();
                    if (!isLiveSupabase) renderAllScreens();
                } else {
                    const inserted = await db_addMerchandise(name, qtyVal, unit, sectorId, user);
                    if (inserted) {
                        showToast("Carga Exitosa", `Se registró "${name}" con éxito.`, "success");
                        document.getElementById('dynamic-modal').remove();
                        if (!isLiveSupabase) renderAllScreens();
                    }
                }
            };
        }

        function formatRoleLabel(role) {
            if (role === 'owner') return 'DUEÑO';
            if (role === 'admin') return 'ADMINISTRADOR';
            if (role === 'staff') return 'PERSONAL';
            return String(role || '').toUpperCase();
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function loadSectorItemDropdown(sectorId) {
            const select = document.getElementById('select-existing-items');
            const nameInput = document.getElementById('new-merch-name');
            const unitSelect = document.getElementById('new-merch-unit');
            if (!select || !nameInput || !unitSelect) return;

            const db = getMockDb();
            const items = db.merchandise
                .filter(m => m.sector_id === sectorId && m.active)
                .sort((a, b) => a.name.localeCompare(b.name));

            let optionsHtml = `<option value="">➕ Crear un artículo nuevo</option>`;
            items.forEach(i => {
                optionsHtml += `<option value="${escapeHtml(i.name)}">📦 ${escapeHtml(i.name)} (${i.unit})</option>`;
            });
            select.innerHTML = optionsHtml;
            nameInput.readOnly = false;
            nameInput.value = '';
            nameInput.classList.remove('bg-slate-100', 'text-slate-500');
            nameInput.classList.add('bg-white', 'text-slate-900');
            unitSelect.disabled = false;
        }

        function handleExistingItemSelectChange(value) {
            const nameInput = document.getElementById('new-merch-name');
            const unitSelect = document.getElementById('new-merch-unit');
            const sectorId = document.getElementById('new-merch-sector')?.value;
            if (!nameInput || !unitSelect) return;

            if (!value) {
                nameInput.readOnly = false;
                nameInput.value = '';
                nameInput.classList.remove('bg-slate-100', 'text-slate-500');
                nameInput.classList.add('bg-white', 'text-slate-900');
                unitSelect.disabled = false;
                setTimeout(() => nameInput.focus(), 50);
                return;
            }

            const db = getMockDb();
            const matched = db.merchandise.find(m =>
                m.sector_id === sectorId && m.name.toLowerCase() === value.toLowerCase() && m.active
            );
            nameInput.value = matched?.name || value;
            nameInput.readOnly = true;
            nameInput.classList.remove('bg-white', 'text-slate-900');
            nameInput.classList.add('bg-slate-100', 'text-slate-500');
            if (matched) unitSelect.value = matched.unit;
            unitSelect.disabled = true;
        }

        async function openAddCodeModal(screenContext) {
            let user = null;
            if (screenContext === 'owner') user = activeSessions.owner;
            else if (screenContext === 'admin') user = activeSessions.admin;
            else if (screenContext === 'fullscreen') user = activeSessions.fullscreen;

            if (!user) return;

            const sectors = await db_getSectors();

            let sectorSection = '';
            let roleSection = '';

            if (user.role === 'owner') {
                sectorSection = `
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Asignar a Sector</label>
                        <select id="new-code-sector" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 text-xs focus:ring-1 focus:ring-emerald-700 outline-none font-semibold">
                            <option value="">Consolidado Dueño (Sin Sector)</option>
                            ${sectors.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
                        </select>
                    </div>
                `;
                roleSection = `
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Rango del Código</label>
                        <select id="new-code-role" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 text-xs focus:ring-1 focus:ring-emerald-700 outline-none font-bold">
                            <option value="staff">Personal del sector asignado</option>
                            <option value="admin">Administrador del sector asignado</option>
                            <option value="owner">Propietario / Dueño (Owner)</option>
                        </select>
                    </div>
                `;
            } else {
                const userSecName = sectors.find(s => s.id === user.sector_id)?.name || 'Tu Sector';
                sectorSection = `
                    <input type="hidden" id="new-code-sector" value="${user.sector_id}">
                    <div class="text-[11px] bg-slate-100 p-2.5 rounded-xl text-slate-700 font-bold">
                        Área de Acceso: ${userSecName}
                    </div>
                `;
                roleSection = `
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Rango del Código</label>
                        <select id="new-code-role" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 text-xs focus:ring-1 focus:ring-emerald-700 outline-none font-bold">
                            <option value="staff">Personal de ${userSecName}</option>
                            <option value="admin">Administrador de ${userSecName}</option>
                        </select>
                    </div>
                `;
            }

            const modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-pop-up";
            modal.id = "dynamic-modal";
            modal.innerHTML = `
                <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full overflow-hidden border border-slate-200">
                    <div class="bg-slate-900 text-white p-4 font-bold flex justify-between items-center border-b border-emerald-950">
                        <h4 class="text-sm font-serif">Crear Clave de Entrada</h4>
                        <button onclick="document.getElementById('dynamic-modal').remove()" class="text-white hover:text-red-300 font-bold text-lg leading-none">&times;</button>
                    </div>
                    <div class="p-4 space-y-3.5 text-xs">
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Nombre Completo del Colaborador</label>
                            <input type="text" id="new-code-name" placeholder="Ej: Juan Pérez" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 focus:ring-1 focus:ring-emerald-700 outline-none font-bold">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Clave de Seguridad (4 a 6 Letras/Números)</label>
                            <input type="text" id="new-code-text" maxlength="6" placeholder="Ej: STF22" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2.5 focus:ring-1 focus:ring-emerald-700 outline-none font-mono uppercase tracking-widest text-center text-sm font-bold">
                            <p class="text-[9px] text-slate-400 mt-1">Obligatorio: Entre 4 y 6 caracteres.</p>
                        </div>
                        ${roleSection}
                        ${sectorSection}
                    </div>
                    <div class="bg-slate-50 px-4 py-3 border-t border-slate-100 flex justify-end gap-2 text-xs font-bold">
                        <button onclick="document.getElementById('dynamic-modal').remove()" class="bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl">Cancelar</button>
                        <button id="btn-submit-new-code" class="bg-slate-950 text-white hover:bg-slate-800 px-3.5 py-2 rounded-xl shadow">Crear Clave 🔐</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('btn-submit-new-code').onclick = async () => {
                const name = document.getElementById('new-code-name').value;
                const codeText = document.getElementById('new-code-text').value;
                const role = document.getElementById('new-code-role').value;
                const sectorVal = document.getElementById('new-code-sector').value;
                const sectorId = sectorVal === "" ? null : sectorVal;

                if (!name || !codeText) {
                    alert("Por favor completa todos los campos del código.");
                    return;
                }

                const inserted = await db_createCode(codeText, name, role, sectorId);
                if (inserted) {
                    showToast("Clave Generada", `Acceso asignado para ${name}.`, "success");
                    document.getElementById('dynamic-modal').remove();
                    if (!isLiveSupabase) renderAllScreens();
                }
            };
        }

        // --- SHOW EMBEDDED MODAL ALERTS ---
        function showModalAlert(title, message) {
            const modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-black/75 z-55 flex items-center justify-center p-4 backdrop-blur-sm animate-pop-up";
            modal.id = "alert-modal";
            modal.innerHTML = `
                <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full overflow-hidden border border-red-200">
                    <div class="bg-red-950 text-red-100 p-4 font-bold flex justify-between items-center border-b border-red-900">
                        <h4 class="text-xs uppercase font-extrabold tracking-wider flex items-center gap-1.5">🚨 ${title}</h4>
                        <button onclick="document.getElementById('alert-modal').remove()" class="text-red-300 hover:text-white font-bold text-lg leading-none">&times;</button>
                    </div>
                    <div class="p-5 text-slate-700 text-xs leading-relaxed space-y-2">
                        <p>${message}</p>
                    </div>
                    <div class="bg-slate-50 px-4 py-3 border-t border-slate-100 flex justify-end text-xs font-bold">
                        <button onclick="document.getElementById('alert-modal').remove()" class="bg-red-900 text-white hover:bg-red-800 px-4 py-2 rounded-xl shadow-md">
                            Entendido 🆗
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // --- TOAST SYSTEMS ---
        function showToast(title, message, type = "info") {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            let colors = "bg-white border-l-4 border-emerald-800 text-slate-800";
            if (type === "success") colors = "bg-emerald-950 text-white border-l-4 border-emerald-400";
            else if (type === "error") colors = "bg-red-950 text-red-100 border-l-4 border-red-500";
            else if (type === "warning") colors = "bg-amber-100 text-amber-950 border-l-4 border-amber-500";

            toast.className = `p-3 rounded-xl shadow-xl max-w-xs w-80 text-xs flex justify-between items-start gap-2.5 transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto ${colors}`;
            toast.innerHTML = `
                <div>
                    <strong class="font-extrabold block mb-0.5">${title}</strong>
                    <span>${message}</span>
                </div>
                <button class="font-bold opacity-60 hover:opacity-100 leading-none">&times;</button>
            `;

            container.appendChild(toast);
            
            toast.querySelector('button').onclick = () => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            };

            setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-2'), 40);
            setTimeout(() => { if (toast.parentNode) { toast.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => toast.remove(), 300); } }, 4000);
        }

        // --- FULLSCREEN LOGIN / LOGOUT HANDLERS (FUNCIONES QUE FALTABAN) ---
        async function handleFullscreenLogin() {
            const firstName = document.getElementById('fs-login-first')?.value.trim();
            const lastName = document.getElementById('fs-login-last')?.value.trim();
            const code = document.getElementById('fs-login-code')?.value.trim();

            if (!firstName || !lastName || !code) {
                showToast("Campos incompletos", "Por favor completa todos los campos para ingresar.", "warning");
                return;
            }

            if (code.length < 4 || code.length > 6) {
                showToast("Código Inválido", "El código debe tener entre 4 y 6 caracteres.", "warning");
                return;
            }

            const session = await db_validateCode(code, firstName, lastName);

            if (!session) {
                showToast("Código Inválido", "El código ingresado no es válido o está desactivado. Verifica con tu administrador.", "error");
                return;
            }
            if (session.error === 'name_mismatch') {
                showToast("Nombre incorrecto", "El nombre y apellido no coinciden con la persona asignada a este código.", "error");
                return;
            }

            activeSessions.fullscreen = session;
            renderFullscreenScreen();
            showToast("Ingreso Exitoso", `Bienvenido/a ${session.name}. Has accedido como ${formatRoleLabel(session.role)}.`, "success");
        }

        function handleFullscreenLogout() {
            activeSessions.fullscreen = null;
            renderFullscreenScreen();
            showToast("Sesión Cerrada", "Has salido del sistema de inventario.", "info");
        }

    </script>
</body>
